<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blind Cricket </title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#2a0a6b 0%,#1a0840 100%);color:#fff;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{max-width:1050px;margin:auto;padding:0 0 40px}
a{color:inherit}
button{border:0;border-radius:11px;padding:13px 16px;background:#32d583;color:#06130c;font-weight:800;cursor:pointer;min-height:44px;font-size:15px}
button.secondary{background:#1b304b;color:#fff;border:1px solid #3a5878}
button.danger{background:#ff6374;color:#fff}
button.gold{background:linear-gradient(180deg,#f4d675,#d4af37);color:#241a00}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{padding:12px;border-radius:10px;border:1px solid #385675;background:#091625;color:#fff;font-size:15px;min-height:44px}
.skip-link{position:absolute;left:-999px;top:0;background:#fff;color:#111;padding:10px 16px;border-radius:0 0 10px 0;z-index:999}
.skip-link:focus{left:0}
:focus-visible{outline:3px solid #63a4ff;outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.topbar{height:64px;background:#3d1f8f;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:20;border-bottom:2px solid #0a1931}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#d4af37;border:2px solid #d4af37;flex:none}
.avatar-fallback{width:48px;height:48px;border-radius:50%;background:#d4af37;color:#241a00;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.tb-name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.tb-sub{font-size:11px;color:#e7d9ff;display:flex;gap:6px;align-items:center}
.tb-right{display:flex;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:50%;background:#2a1670;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;cursor:pointer;position:relative}
.iconbtn .dot{position:absolute;top:2px;right:2px;width:9px;height:9px;background:#ff6374;border-radius:50%}
.logo-wrap{text-align:center;padding:26px 14px 10px}
.logo-emoji{font-size:34px;letter-spacing:6px}
.logo-text{font-size:30px;font-weight:900;letter-spacing:2px;background:linear-gradient(180deg,#fff6d0,#d4af37 60%,#8f6d10);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 0 rgba(0,0,0,.25);margin-top:4px}
.logo-base{height:6px;width:180px;margin:6px auto 0;background:linear-gradient(90deg,#0f5f2e,#1c8f45,#0f5f2e);border-radius:4px}
.sheet{background:#fff;color:#181022;border-radius:24px 24px 0 0;margin-top:18px;padding:22px 18px 28px;min-height:50vh}
.sheet-handle{width:48px;height:5px;background:#ddd;border-radius:3px;margin:0 auto 14px}
.contact{color:#8a3ffc;text-align:center;font-weight:800;font-size:12px;letter-spacing:.5px;margin-bottom:18px;text-decoration:underline;cursor:pointer;background:none;border:0}
.bigbtn{width:100%;text-align:left;background:#f6f3ff;border:1px solid #e3daff;border-radius:16px;padding:16px 18px;margin-bottom:14px;display:flex;flex-direction:column;gap:3px;min-height:64px;cursor:pointer}
.bigbtn b{font-size:17px;color:#241a4d}
.bigbtn span{font-size:12.5px;color:#6b5f8f}
.bigbtn:focus-visible{outline:3px solid #8a3ffc;outline-offset:2px}
.badge{display:inline-block;background:#0a1931;color:#d4af37;border:1px solid #d4af37;border-radius:20px;padding:5px 12px;font-size:11.5px;font-weight:800;margin:4px 4px 4px 0}
.screen,.card{background:#102038;border:1px solid #2c4868;border-radius:18px;padding:20px}
.screen{margin:18px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.menu-grid button{width:100%;min-height:70px;text-align:left;font-size:16px}
.nav,.row{display:flex;gap:8px;flex-wrap:wrap}
.stat{font-size:28px;font-weight:900}
.muted{color:#aebbd0}
.form{display:grid;gap:12px;max-width:520px}
.notice{padding:12px;margin:0 14px 14px;border-radius:10px;background:#18314d}
.err{border-left:4px solid #ff6374}
.bar{height:12px;background:#263d59;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#32d583,#d4af37)}
.commentary{min-height:110px;background:#071522;border:1px solid #2c4868;border-radius:12px;padding:16px;line-height:1.7}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shots button{min-height:60px}
.log{max-height:280px;overflow:auto}
.tag{background:#203b59;padding:4px 9px;border-radius:20px;font-size:12px}
.levelcard{border-left:5px solid #2c4868}
.levelcard.unlocked{border-left-color:#32d583}
.levelcard.current{border-left-color:#d4af37;background:#16294a}
.modal-back{position:fixed;inset:0;background:rgba(4,2,16,.78);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:#12102c;border:2px solid #d4af37;border-radius:20px;max-width:460px;width:100%;padding:26px;text-align:center}
.modal h2{font-size:26px;margin:6px 0}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{padding:9px 16px;border-radius:20px;background:#1b304b;color:#fff;border:1px solid #3a5878;cursor:pointer;min-height:44px}
.pill.active{background:#32d583;color:#06130c;font-weight:800;border-color:#32d583}
.squadrow{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #223752;gap:8px;flex-wrap:wrap}
.b1{color:#ffd166;font-weight:800}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid #223752;font-size:13px}
@media(max-width:600px){.shots{grid-template-columns:repeat(2,1fr)}.screen{padding:14px}.logo-text{font-size:24px}}
</style></head><body>

 }

const clipCursor={};
function rotateClip(pid,key,files){
 const cursorKey=pid+":"+key,index=clipCursor[cursorKey]||0;
 clipCursor[cursorKey]=(index+1)%files.length;
 return {pid,path:files[index%files.length]};
}
function pickClip(eventKey,packId){
 const pid=packId||activeCommentaryPack||pickPackForSetting(player.settings.commentator);
 const pack=MANIFEST[pid]||MANIFEST.extra_default,key=normEvent(eventKey);
 const own=pack.events[key];if(own?.length)return rotateClip(pid,key,own);
 // First try any other commentator in the chosen language, then the direct
 // sounds/extra/<event> folder. Never substitute a different event.
 const sameLanguage=Object.entries(MANIFEST).filter(([id,p])=>id!==pid&&p.lang===pack.lang&&p.events[key]?.length);
 if(sameLanguage.length){const [id,p]=sameLanguage[Math.floor(Math.random()*sameLanguage.length)];return rotateClip(id,key,p.events[key])}
 const folder=(MANIFEST.extra_default.events[key]||[]).filter(path=>path.startsWith("extra/"));
 return folder.length?{pid:"extra_default",path:folder[Math.floor(Math.random()*folder.length)]}:null;
}

 match.text=prefix+"Test innings "+match.innings+". "+(side==="player"?"You are batting.":"The opponent is batting.")+
 (match.target!=null?" Target "+match.target+".":"")+" "+testStatus();
 announce(match.text,true);speak(match.text);saveMatchCheckpoint();render();document.getElementById("matchHeading")?.focus();
}
function endTestInnings(reason){
 const side=match.current,inn=currentInnings();
 if(side==="player"&&inn.wickets>=10&&inn.runs===0)player.duckWickets++;
 if(side==="player")match.playerTotal+=inn.runs;else match.aiTotal+=inn.runs;
 match.testInnings.push({side,runs:inn.runs,wickets:inn.wickets,balls:inn.balls,reason});
 match.sides[side]=newInningsState();
 if(match.innings===4){finishMatch(reason==="chased"?"chased":"completed");return}
 if(testBallsLeft()<=0){finishMatch("time");return}
 if(match.innings===1){beginTestInnings(oppositeSide(side));return}
 if(match.innings===2){
  const first=match.testInnings[0].side,lead=first==="player"?match.playerTotal-match.aiTotal:match.aiTotal-match.playerTotal;
  // In this fixed 450-over Test, use the long-match 200-run follow-on threshold.
  if(lead>=200){
   if(first==="player"){
    match.awaitingFollowOn=true;match.text="You lead by "+lead+" runs. Enforce follow-on or bat again?";
    announce(match.text,true);saveMatchCheckpoint();render();return;
   }
   match.followOn=testBallsLeft()>900; // Computer enforces if there is enough match time.
   beginTestInnings(match.followOn?side:first,match.followOn?"Opponent enforced the follow-on. ":"Opponent declined the follow-on. ");return;
  }
  beginTestInnings(first);return;
 }
 if(match.innings===3){
  const first=match.testInnings[0].side,second=oppositeSide(first);
  if(match.followOn&&side===second){
   const deficit=first==="player"?match.playerTotal-match.aiTotal:match.aiTotal-match.playerTotal;
   if(deficit>0){finishMatch("innings");return}
   beginTestInnings(first);return;
  }
  if((first==="player"?match.aiTotal-match.playerTotal:match.playerTotal-match.aiTotal)>0){finishMatch("innings");return}
  beginTestInnings(second);return;
 }
}
function maybeAiDeclare(){
 if(!isTest()||match.current!=="ai"||match.innings>3||currentInnings().balls<60)return false;
 const margin=match.aiTotal+currentInnings().runs-match.playerTotal;
 if(match.innings===1&&currentInnings().runs>=400&&testBallsLeft()<2000){endTestInnings("declared");return true}
 if(match.innings===3&&margin>=240&&testBallsLeft()<=1100){endTestInnings("declared");return true}
 return false;
}
function formatKey(){
 if(isTest())return "Test";
 const n=match.overs;
 return n===1?"1-over":n===5?"5-over":n===10?"T10":n===20?"T20":n===50?"ODI":"Custom "+n+" overs";
}
function perMatchSalary(){
 if(isTest())return 1200;
 const n=match.overs;
 return n===1?30:n===5?100:n===10?200:n===20?400:n===50?800:Math.min(800,Math.max(30,Math.round(n*16)));
}
function winCoinBonus(){return isTest()?600:Math.min(400,Math.max(20,Math.round(match.overs*8)))}
function levelRewardPool(l){return l>=8?["shirt","car","premiumbat","kitbag"]:l>=5?["shirt","jersey","powerbat","kitbag"]:["bat","ball","kit","gloves"]}
function awardWinItem(){
 if(Math.random()>=.12)return null;
 const pool=levelRewardPool(player.level).filter(id=>!player.inventory[id]);
 if(!pool.length)return null;
 const id=pool[Math.floor(Math.random()*pool.length)],item=SHOP.find(i=>i.id===id);
 player.inventory[id]={dur:item.dur};return item;
}
function finishMatch(reason){
 fadeBgm(0);
 match.done=true;
 let draw=false,win;
 if(isTest()){
  draw=reason==="time"||(reason!=="innings"&&match.playerTotal===match.aiTotal);
  win=!draw&&match.playerTotal>match.aiTotal;
  match.result=draw?"DRAW":win?"WIN":"LOSS";
 }else{win=match.playerTotal>match.aiTotal;match.result=win?"WIN":"LOSS"}
 match.win=win;
 let lvl=levelData(player.level);
 let coinBonus=win?winCoinBonus():0;
 let reward=(draw?0:win?lvl.win:lvl.loss)+coinBonus;
 let xpGain=draw?25:win?100:25;
 let pRuns=match.playerBatRuns,pWkts=match.playerBowlWickets,pFours=match.playerBatFours,pSixes=match.playerBatSixes;

 player.matches++;
 if(win){player.wins++;const key=formatKey();player.formatWins[key]=(player.formatWins[key]||0)+1}else if(!draw)player.losses++;
 player.runs+=pRuns;
 player.wickets+=pWkts;
 player.fours+=pFours;
 player.sixes+=pSixes;
 if(pRuns>=100)player.centuries++;
 else if(pRuns>=50)player.fifties++;
 if(pRuns>player.bestScore)player.bestScore=pRuns;
 if(pWkts>0){
  let econ=match.playerBallsBowled>0?(match.playerRunsConceded/(match.playerBallsBowled/6)):0;
  let prevBestWkts=+((player.bestSpell||"0/0").split("/")[0])||0;
  if(pWkts>=prevBestWkts)player.bestSpell=pWkts+"/"+match.playerRunsConceded;
 }
 player.totalBallsFaced=(player.totalBallsFaced||0)+match.playerBallsFaced;
 player.totalBallsBowled=(player.totalBallsBowled||0)+match.playerBallsBowled;
 player.totalRunsConceded=(player.totalRunsConceded||0)+match.playerRunsConceded;
 if(match.playerTotal!==undefined&&match.aiTotal!==undefined){
  // dismissals: count a dismissal only when the player's batting innings ended all-out
  let ps=match.sides.player;
  if(ps&&ps.wickets>=wicketsLimit())player.dismissals=(player.dismissals||0)+1;
 }
 player.strikeRate=player.totalBallsFaced>0?Math.round(player.runs/player.totalBallsFaced*1000)/10:0;
 player.economy=player.totalBallsBowled>0?Math.round(player.totalRunsConceded/(player.totalBallsBowled/6)*100)/100:0;
 player.batAvg=player.dismissals>0?Math.round(player.runs/player.dismissals*10)/10:player.runs;
 player.bowlAvg=player.wickets>0?Math.round(player.totalRunsConceded/player.wickets*10)/10:0;
 let potm=win&&(pRuns>=50||pWkts>=3);
 if(potm)player.playerOfMatch++;
 const matchSalary=perMatchSalary();player.balance+=reward+matchSalary;
 player.xp+=xpGain;

 let newAchievements=[];
 for(const a of ACHIEVEMENTS){
  if(!player.achievements.includes(a.id)&&a.check(player)){player.achievements.push(a.id);newAchievements.push(a)}
 }
 let leveledUp=null;
 let nl=nextLevelData(player.level);
 while(nl&&meetsReq(nl.req,player)){
  player.level=nl.level;
  player.balance+=nl.unlockBonus||0;
  if(nl.levelUpBonus)player.balance+=nl.levelUpBonus;
  leveledUp=nl;
  nl=nextLevelData(player.level);
 }
 let salaryPaid=0;
 if(player.matches%10===0){
  let cur=levelData(player.level);
  if(cur.salary){salaryPaid=cur.salary;player.balance+=salaryPaid}
 }
 const bonusItem=win?awardWinItem():null;
 if(!isTest())advanceOfflineTournament(win);
 player.history.push({date:Date.now(),result:match.result,runs:pRuns,wickets:pWkts,reward,mode:matchSetupState.mode,format:matchSetupState.format});
 if(player.history.length>200)player.history=player.history.slice(-200);
 saveMatchCheckpoint(true);
 matchSaveQueue.then(()=>pushCloud()).catch(x=>console.error("post-match save",x));

 match.rewardBreakdown={reward,coinBonus,matchSalary,bonusItem,xpGain,newBalance:player.balance,newAchievements,leveledUp,salaryPaid,pRuns,pWkts,potm};
 if(!draw)playResultSound(win);
 if(leveledUp){setTimeout(()=>{levelUpBeep();announce("Level up! You are now "+leveledUp.title+". Bonus "+money(leveledUp.unlockBonus)+" added. New unlocks: "+leveledUp.unlocks.join(", ")+".",true)},600)}
 announce((draw?"Test match drawn. Neither team won.":win?"You won the match!":"Match complete. You lost.")+" Salary "+money(matchSalary)+"."+(coinBonus?" Win bonus "+money(coinBonus)+".":"")+(bonusItem?" Bonus item "+bonusItem.name+" added to Collection.":""),true);
 render();
}

async function refreshTrades(){
 if(!auth.currentUser||tradeLoading)return;
 tradeLoading=true;tradeError="";render();
 try{
  const uid=auth.currentUser.uid;
  const [received,sent]=await Promise.all([
   getDocs(query(collection(db,"itemRequests"),where("toUid","==",uid),limit(50))),
   getDocs(query(collection(db,"itemRequests"),where("fromUid","==",uid),limit(50)))
  ]);
  if(auth.currentUser?.uid!==uid)return;
  incomingTrades=received.docs.map(d=>({id:d.id,...d.data()}));
  outgoingTrades=sent.docs.map(d=>({id:d.id,...d.data()}));
 }catch(x){tradeError="Could not load item requests ("+(x.code||"unknown-error")+"). Check Firestore rules."}
 finally{tradeLoading=false;if(page==="shop")render()}
}
async function offerItem(ev){
 ev.preventDefault();if(economyBusy){tradeError="Finish the current item action first.";render();return}economyBusy=true;
 const uid=auth.currentUser?.uid, itemId=document.getElementById("offerItem").value;
 const toUid=document.getElementById("recipientUid").value.trim();
 const kind=document.getElementById("offerKind").value;
 const price=kind==="gift"?0:Number(document.getElementById("offerPrice").value);
 if(!uid||!SHOP.some(i=>i.id===itemId)||!toUid||toUid===uid||!((kind==="sale"&&Number.isSafeInteger(price)&&price>0)||(kind==="gift"&&price===0))){tradeError="Select an owned item, another player's ID, and a valid whole-₹ sale price or gift.";render();return}
 const offerRef=doc(collection(db,"itemRequests")),senderRef=doc(db,"players",uid),recipientRef=doc(db,"players",toUid);
 try{
  await runTransaction(db,async tx=>{
   const sender=await tx.get(senderRef);
   if(!sender.exists())throw Error("Your saved profile is missing. The recipient ID is checked on send.");
   const inventory=sender.data().inventory||{},owned=inventory[itemId];
   if(!owned)throw Error("Item no longer owned.");
   const updated={...inventory};delete updated[itemId];
   tx.update(senderRef,{inventory:updated});
   tx.set(offerRef,{fromUid:uid,toUid,itemId,item:{dur:owned.dur},kind,price,status:"pending",createdAt:Date.now()});
  });
  const refreshed=await getDoc(senderRef);if(refreshed.exists()&&auth.currentUser?.uid===uid){player.inventory=refreshed.data().inventory||{};player.balance=refreshed.data().balance||0;rememberEconomy(uid,refreshed.data());saveLocal()}tradeError="Request sent. Item reserved until the other player accepts or declines. Sale price "+money(price)+".";announce(tradeError,true);await refreshTrades();
 }catch(x){tradeError=x.message||x.code||"Could not send request.";announce(tradeError,true);render()}finally{economyBusy=false}
}
async function decideTrade(id,accept){
 if(economyBusy)return;economyBusy=true;
 const uid=auth.currentUser?.uid,ref=doc(db,"itemRequests",id);
 try{
  await runTransaction(db,async tx=>{
   const request=await tx.get(ref);if(!request.exists())throw Error("Request not found.");
   const r=request.data();if(r.toUid!==uid||r.status!=="pending")throw Error("Request already handled or not yours.");
   const senderRef=doc(db,"players",r.fromUid),receiverRef=doc(db,"players",uid);
   const sender=accept&&r.price===0?null:await tx.get(senderRef);
   const receiver=accept?await tx.get(receiverRef):null;
   if((sender&&!sender.exists())||(receiver&&!receiver.exists()))throw Error("Player profile missing.");
   if(accept){
    if(receiver.data().inventory?.[r.itemId])throw Error("You already own this item.");
    if((receiver.data().balance||0)<r.price)throw Error("Not enough ₹ in your wallet.");
    tx.update(receiverRef,{inventory:{...(receiver.data().inventory||{}),[r.itemId]:r.item},balance:(receiver.data().balance||0)-r.price,lastTradeId:id});
    if(r.price)tx.update(senderRef,{balance:(sender.data().balance||0)+r.price,lastTradeId:id});
   }else{
    if(sender.data().inventory?.[r.itemId])throw Error("Sender already has this item. Contact the game owner.");
    tx.update(senderRef,{inventory:{...(sender.data().inventory||{}),[r.itemId]:r.item},lastTradeId:id});
   }
   tx.update(ref,{status:accept?"accepted":"declined",resolvedAt:Date.now()});
  });
  const snap=await getDoc(doc(db,"players",uid));
  if(snap.exists()&&auth.currentUser?.uid===uid){player.inventory=snap.data().inventory||{};player.balance=snap.data().balance||0;rememberEconomy(uid,snap.data());saveLocal()}
  tradeError=accept?"Item accepted. Wallet ₹ and item transferred.":"Request declined. Item returned to sender.";announce(tradeError,true);await refreshTrades();
 }catch(x){tradeError=x.message||x.code||"Could not handle request.";announce(tradeError,true);render()}finally{economyBusy=false}
}
async function sellItem(id){
 if(economyBusy)return;
 const owned=player.inventory[id],it=SHOP.find(i=>i.id===id),uid=auth.currentUser?.uid;
 if(!owned||!it||!uid)return;
 const price=Math.floor(shopPrice(it.base,player.level)/2);
 if(!confirm("Sell "+it.name+" for "+money(price)+"?"))return;economyBusy=true;
 try{
  const ref=doc(db,"players",uid);
  await runTransaction(db,async tx=>{const snap=await tx.get(ref);const data=snap.data();if(!data?.inventory?.[id])throw Error("Item no longer owned.");const inventory={...data.inventory};delete inventory[id];tx.update(ref,{inventory,balance:(data.balance||0)+price})});
  const latest=await getDoc(ref);if(latest.exists()&&auth.currentUser?.uid===uid){player.inventory=latest.data().inventory||{};player.balance=latest.data().balance||0;rememberEconomy(uid,latest.data());saveLocal()}msg=it.name+" sold for "+money(price)+".";announce(msg,true);render();
 }catch(x){tradeError=x.message||x.code||"Sell failed.";announce(tradeError,true);render()}finally{economyBusy=false}
}

/* ---------------- Render dispatcher ---------------- */
function render(){
 if(booting){loadingScreen();return}
 if(!auth.currentUser){authScreen();return}
 if(page==="onboarding"){onboardingScreen();return}
 if(page==="loadError"){
  root.innerHTML='<main id="main" class="screen" role="alert"><h1>Profile could not load</h1><p>'+e(err)+'</p><button id="retryLoad" type="button">Retry loading profile</button></main>';
  document.getElementById("retryLoad").onclick=()=>{booting=true;render();loadForUser(auth.currentUser)};
  return;
 }
 let body;
 if(page==="home")body=homeHandCricket();
 else if(page==="help")body=helpScreen();
 else if(page==="career")body=careerScreen();
 else if(page==="profile"||page==="mycollection")body=profileScreen();
 else if(page==="admin")body=adminScreen();
 else if(page==="editProfile")body=editProfileScreen();
 else if(page==="shop")body=shopScreen();
 else if(page==="settings")body=settingsScreen();
 else if(page==="matchSetup")body=matchSetupScreen();
 else if(page==="match")body=match?matchScreen():homeHandCricket();
 else if(page==="teamCreate")body=teamCreateScreen();
 else if(page==="mySquad")body=mySquadScreen();
 else if(page==="teamVsTeam")body=teamVsTeamScreen();
 else if(page==="coach")body=coachScreen();
 else if(page==="tournaments")body=tournamentsScreen();
 else if(page==="ibplAuction")body=ibplAuctionScreen();
 else if(page==="resume")body=resumeScreen();
 else if(page==="resumeTournament")body=tournamentsScreen();
 else if(page==="notifications")body=topBar()+'<div class="screen"><h1>Notifications</h1><p class="muted">No new notifications.</p></div>';
 else body=homeHandCricket();
 root.innerHTML='<div class="wrap"><main id="main">'+(msg?'<div class="notice">'+e(msg)+'</div>':'')+body+'</main></div>'+(match?.done?"":menuOverlay());
 bind();
}

/* ---------------- Event binding ---------------- */
async function google(){
 err="";
 try{await signInWithPopup(auth,new GoogleAuthProvider())}
 catch(x){
  if(x.code==="auth/popup-blocked"){
   announce("The popup was blocked. Continuing with redirect sign-in.",true);
   try{await signInWithRedirect(auth,new GoogleAuthProvider());return}
   catch(y){x=y}
  }
  err=friendlyAuthError(x)+" ("+(x.code||"unknown-error")+")";
  announce(err,true);render();
 }
}

async function buy(id){
 if(economyBusy)return;economyBusy=true;
 let it=SHOP.find(x=>x.id===id);
 let price=shopPrice(it.base,player.level);
 if(!it||player.balance<price||player.inventory[id]){economyBusy=false;return}
 try{
  const uid=auth.currentUser?.uid,ref=doc(db,"players",uid);
  await runTransaction(db,async tx=>{const snap=await tx.get(ref);const data=snap.data();if(!data||data.inventory?.[id]||(data.balance||0)<price)throw Error("Item already owned or not enough ₹.");tx.update(ref,{inventory:{...(data.inventory||{}),[id]:{dur:it.dur}},balance:data.balance-price})});
  const latest=await getDoc(ref);if(latest.exists()&&auth.currentUser?.uid===uid){player.inventory=latest.data().inventory||{};player.balance=latest.data().balance||0;rememberEconomy(uid,latest.data());saveLocal()}
  msg=it.name+" purchased for "+money(price)+".";announce(msg,true);speak(msg);render();
 }catch(x){tradeError=x.message||x.code||"Buy failed.";announce(tradeError,true);render()}finally{economyBusy=false}
}

 });

async function doLogout(){
 fadeBgm(0);
 await signOut(auth);
 clearLocalSession();
 stopCommentary();stopResultSound();
 player={...base,settings:{...DEFAULT_SETTINGS}};
 page="login";match=null;
 render();
}

/* Keyboard accessibility shortcuts: B = bat/primary action, Ctrl+B = bowl, A = summary */
window.addEventListener("keydown",(ev)=>{
 if(!match||match.done)return;
 if(match.awaitingFollowOn)return;
 if(ev.key.toLowerCase()==="b"&&!ev.ctrlKey&&match.current==="player"){doPlayerShot("single")}
 else if(ev.key.toLowerCase()==="b"&&ev.ctrlKey&&match.current==="ai"){doPlayerBowl("straight")}
 else if(ev.key.toLowerCase()==="a"){let inn=currentInnings();announce("Score "+inn.runs+" for "+inn.wickets+", over "+Math.floor(inn.balls/6)+"."+(inn.balls%6),true)}
});

render();
</script></body></html>
