<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blind Cricket Pro Ultimate</title>
<meta name="description" content="A fully accessible cricket game for blind and low-vision players, with spoken commentary, text-to-speech, and keyboard-friendly controls.">
<style>

*{box-sizing:border-box}
body{margin:0;background:#07111f;color:#fff;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:18px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#07111f;padding:10px 0;z-index:5}
.brand{font-size:22px;font-weight:900}
.brand small{display:block;font-size:12px;font-weight:500;color:#aebbd0}
.wallet{padding:10px 15px;border-radius:20px;background:#1a304c;color:#ffd166;font-weight:900;white-space:nowrap}
.screen,.card{background:#102038;border:1px solid #2c4868;border-radius:18px;padding:20px}
.screen{margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.grid.tight{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.nav,.row{display:flex;gap:8px;flex-wrap:wrap}
.menu button{width:100%;min-height:72px;text-align:left;font-size:18px}
button{border:0;border-radius:11px;padding:13px 16px;background:#32d583;color:#06130c;font-weight:800;cursor:pointer;font-size:15px}
button.secondary{background:#1b304b;color:#fff;border:1px solid #3a5878}
button.danger{background:#ff6374;color:#fff}
button.ghost{background:transparent;color:#8fd6ff;border:1px solid #2c4868}
button:disabled{opacity:.4;cursor:not-allowed}
button:hover:not(:disabled){filter:brightness(1.08)}
.stat{font-size:30px;font-weight:900}
.muted{color:#aebbd0}
.small{font-size:13px}
.form{display:grid;gap:12px;max-width:520px}
.form input,.form select{padding:13px;border-radius:10px;border:1px solid #385675;background:#091625;color:#fff;font-size:15px;width:100%}
.notice{padding:12px 14px;margin:12px 0;border-radius:10px;background:#18314d;border-left:4px solid #63a4ff}
.notice.err{border-left-color:#ff6374;background:#3a1620}
.notice.ok{border-left-color:#32d583;background:#13301f}
.bar{height:14px;background:#263d59;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:#32d583;transition:width .3s}
.bar.dur i{background:#ffd166}
.bar.dur.low i{background:#ff6374}
.commentary{min-height:110px;background:#071522;border:1px solid #2c4868;border-radius:12px;padding:16px;line-height:1.7;font-size:17px}
.shots,.deliveries{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shots button,.deliveries button{min-height:64px;font-size:15px}
.log{max-height:320px;overflow:auto}
.tag{background:#203b59;padding:4px 10px;border-radius:20px;font-size:13px;display:inline-block}
.tag.locked{background:#2a2f3d;color:#8b93a5}
.tag.win{background:#123e2b;color:#54e39a}
.tag.loss{background:#3e1a20;color:#ff8b96}
.scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#18314d;padding:6px 12px;border-radius:16px;font-size:13px;margin:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.achv{opacity:.4}
.achv.unlocked{opacity:1;border-color:#ffd166}
h1{font-size:24px;margin:0 0 6px}
h2{font-size:19px;margin:22px 0 10px}
h3{margin:0 0 6px}
a.linklike{color:#8fd6ff;background:none;border:none;text-decoration:underline;cursor:pointer;padding:0;font:inherit}
:focus-visible{outline:3px solid #63a4ff;outline-offset:3px}
@media(max-width:600px){.shots,.deliveries{grid-template-columns:repeat(2,1fr)}.screen{padding:14px}.stat{font-size:24px}}

</style>
</head>

/* ================== SOUND ENGINE ================== */
const commentaryAudio=new Audio();
let audioCtx=null;
function getAudioCtx(){if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch{audioCtx=null;}}return audioCtx;}

function currentPack(){return MANIFEST[player.settings.commentator]||MANIFEST[DEFAULT_PACK];}

function pickClip(eventKey){
 let pack=currentPack();
 let list=pack.events[eventKey];
 if((!list||!list.length)&&pack.id!==DEFAULT_PACK){pack=MANIFEST[DEFAULT_PACK];list=pack.events[eventKey];}
 if(!list||!list.length)return null;
 const file=list[Math.floor(Math.random()*list.length)];
 return {url:encodeURI(pack.base+file),pack};
}

function speak(text,force){
 if(!force&&!player.settings.tts)return;
 if(!("speechSynthesis" in window))return;
 try{
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.volume=clamp(player.settings.commentaryVolume,0,1);
  window.speechSynthesis.speak(u);
 }catch(err){console.warn("TTS failed",err);}
}

function beep(kind){
 if(!player.settings.sfx)return;
 const ctx=getAudioCtx();
 if(!ctx)return;
 const freqs={start:523,dot:220,run:440,boundary:660,six:880,wicket:150,wide:330,menu:392,levelup:988,buy:660};
 const f=freqs[kind]||440;
 try{
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type=kind==="wicket"?"sawtooth":"sine";
  osc.frequency.value=f;
  gain.gain.value=clamp(player.settings.sfxVolume,0,1)*0.25;
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);
  osc.stop(ctx.currentTime+0.36);
 }catch(err){/* ignore */}
}

/**
 * announce(): the single source of truth for telling the player what happened.
 * - Always updates the on-screen commentary text and the ARIA live regions
 *   (this is the part screen-reader users depend on, regardless of settings).
 * - Optionally plays a real commentary audio clip from the sounds/ library.
 * - Falls back to (or follows up with) speech synthesis.
 */
function announce(eventKey,text,{urgent=false}={}){
 commentaryText=text;
 commentaryLog.unshift(text);
 if(commentaryLog.length>40)commentaryLog.length=40;
 if(liveGentle)liveGentle.textContent=text;
 if(urgent&&liveUrgent)liveUrgent.textContent=text;
 let played=false;
 if(player.settings.commentary&&eventKey){
  const clip=pickClip(eventKey);
  if(clip){
   try{
    commentaryAudio.pause();
    commentaryAudio.src=clip.url;
    commentaryAudio.volume=clamp(player.settings.commentaryVolume,0,1);
    commentaryAudio.onended=()=>{if(player.settings.tts)speak(text);};
    commentaryAudio.onerror=()=>{if(player.settings.tts)speak(text);};
    const p=commentaryAudio.play();
    if(p&&p.catch)p.catch(()=>{if(player.settings.tts)speak(text);});
    played=true;
   }catch(err){played=false;}
  }
 }
 if(!played&&player.settings.tts)speak(text);
}

/* ================== MATCH ENGINE ================== */
const OVERS_PER_INNINGS=2;
const BALLS_PER_OVER=6;
const TOTAL_BALLS=OVERS_PER_INNINGS*BALLS_PER_OVER;
const MAX_WICKETS=4;

function newInningsState(){return {runs:0,wickets:0,balls:0,fours:0,sixes:0,extras:0,log:[]};}

function startMatch(){
 match={
  stage:"toss",
  coinCall:null,
  tossWinner:null,
  battingFirst:null,
  currentInnings:1,
  battingSide:null, // 'player' or 'ai' — who is batting right now
  target:null,
  player:newInningsState(),
  ai:newInningsState(),
  bowlStreakWickets:0,
  hatTrick:false,
  bestInningsRuns:0,
  log:[],
  done:false,
  win:null,
  reward:0,
  xpGain:0
 };
 announce("toss","New match! Call the coin toss: Heads or Tails?");
 render();
}
function callToss(call){
 if(!match)return;
 const result=Math.random()<0.5?"heads":"tails";
 const won=call===result;
 match.tossWinner=won?"player":"ai";
 match.stage=won?"decision":"waiting-ai-decision";
 const line="The coin lands on "+result+". You called "+call+". "+(won?"You won the toss!":"The computer won the toss.");
 announce(won?"win":"toss",line,{urgent:true});
 if(!won){
  const aiChoice=Math.random()<0.5?"bat":"bowl";
  match.battingFirst=aiChoice==="bat"?"ai":"player";
  match.battingSide=match.battingFirst;
  const l2="The computer chooses to "+aiChoice+" first.";
  match.log.unshift(l2);
  setTimeout(()=>{
   if(!match)return;
   match.stage="innings";
   announce(null,l2);
   render();
  },900);
 }
 render();
}
function chooseBatOrBowl(choice){
 if(!match||match.tossWinner!=="player")return;
 match.battingFirst=choice==="bat"?"player":"ai";
 match.battingSide=match.battingFirst;
 match.stage="innings";
 announce(null,"You choose to "+choice+" first.");
 render();
}

const SHOT_TABLE={
 defend:{out:0.03,outcomes:[[0,0.85],[1,0.12]]},
 single:{out:0.06,outcomes:[[1,0.78],[2,0.10],[0,0.06]]},
 double:{out:0.10,outcomes:[[2,0.70],[1,0.15],[3,0.05]]},
 four:{out:0.18,outcomes:[[4,0.55],[1,0.18],[0,0.09]]},
 six:{out:0.28,outcomes:[[6,0.45],[0,0.15],[1,0.12]]}
};
const SHOT_LABEL={defend:"Defend / Dot",single:"Single",double:"Double",four:"Boundary (4)",six:"Big Hit (6)"};

const DELIVERY_TABLE={
 yorker:{out:0.18,wide:0.03,noball:0.02,outcomes:[[0,0.42],[1,0.27],[4,0.09],[6,0.02]]},
 bouncer:{out:0.12,wide:0.05,noball:0.03,outcomes:[[0,0.28],[1,0.22],[4,0.22],[6,0.14]]},
 spin:{out:0.10,wide:0.02,noball:0.01,outcomes:[[0,0.35],[1,0.35],[4,0.13],[6,0.06]]},
 straight:{out:0.08,wide:0.015,noball:0.01,outcomes:[[0,0.45],[1,0.34],[4,0.10],[6,0.02]]}
};
const DELIVERY_LABEL={yorker:"Yorker",bouncer:"Bouncer",spin:"Spin",straight:"Good Length"};

function weightedPick(outcomes,fallback){
 const r=Math.random();
 let cum=0;
 for(const [val,prob] of outcomes){cum+=prob;if(r<=cum)return val;}
 return fallback;
}

function activeInnings(){return match.battingSide==="player"?match.player:match.ai;}

function playerBats(shotKey){
 if(!match||match.stage!=="innings"||match.battingSide!=="player")return;
 const table=SHOT_TABLE[shotKey];
 const inn=match.player;
 // small chance of an extra delivery (wide/no-ball) bowled by the AI
 const extraRoll=Math.random();
 if(extraRoll<0.03){
  inn.runs+=1;inn.extras+=1;
  const line="Wide ball. 1 extra run. Same shot options remain.";
  match.log.unshift(line);
  announce("noball",line);
  applyWearIfMatch();
  render();return;
 }
 if(extraRoll<0.05){
  inn.runs+=1;inn.extras+=1;
  const line="No ball! 1 extra run, and a free hit coming up.";
  match.log.unshift(line);
  announce("noball",line,{urgent:true});
  applyWearIfMatch();
  render();return;
 }
 inn.balls++;
 const out=Math.random()<table.out;
 let line,eventKey;
 if(out){
  inn.wickets++;
  eventKey="out";
  line="OUT! You lose a wicket playing the "+SHOT_LABEL[shotKey].toLowerCase()+" shot.";
  beep("wicket");
 }else{
  const runs=weightedPick(table.outcomes,0);
  inn.runs+=runs;
  if(runs===4)inn.fours++,player.fours++;
  if(runs===6)inn.sixes++,player.sixes++;
  eventKey=runs===0?"run0":runs===6?"run6":runs===4?"run4":runs===3?"run3":runs===2?"run2":"run1";
  line=runs===0?"Dot ball. No run.":(runs===6?"SIX! What a shot!":(runs===4?"FOUR! Great timing!":runs+" run"+(runs===1?"":"s")+" completed."));
  beep(runs>=4?"boundary":runs===0?"dot":"run");
 }
 match.log.unshift(line);
 announce(eventKey,line,{urgent:out});
 applyWearIfMatch();
 checkInningsMilestones(inn);
 maybeEndInnings();
 render();
}

function playerBowls(deliveryKey){
 if(!match||match.stage!=="innings"||match.battingSide!=="ai")return;
 const table=DELIVERY_TABLE[deliveryKey];
 const inn=match.ai;
 const wideRoll=Math.random();
 if(wideRoll<table.wide){
  inn.runs+=1;inn.extras+=1;
  const line="You bowl a wide. 1 extra run conceded.";
  match.log.unshift(line);
  announce("noball",line);
  render();return;
 }
 if(wideRoll<table.wide+table.noball){
  inn.runs+=1;inn.extras+=1;
  const line="No ball! 1 extra run conceded, and a free hit for the batter.";
  match.log.unshift(line);
  announce("noball",line,{urgent:true});
  render();return;
 }
 inn.balls++;
 const out=Math.random()<table.out;
 let line,eventKey;
 if(out){
  inn.wickets++;
  match.bowlStreakWickets++;
  if(match.bowlStreakWickets>=3&&!match.hatTrick){match.hatTrick=true;}
  eventKey="out";
  line="WICKET! Your "+DELIVERY_LABEL[deliveryKey].toLowerCase()+" does the trick. The computer loses a batter.";
  beep("wicket");
 }else{
  match.bowlStreakWickets=0;
  const runs=weightedPick(table.outcomes,0);
  inn.runs+=runs;
  eventKey=runs===0?"run0":runs===6?"run6":runs===4?"run4":"run1";
  line=runs===0?"Dot ball. Excellent bowling.":(runs===6?"SIX conceded! The computer attacks.":(runs===4?"FOUR conceded.":runs+" run"+(runs===1?"":"s")+" conceded."));
  beep(runs>=4?"boundary":runs===0?"dot":"run");
 }
 match.log.unshift(line);
 announce(eventKey,line,{urgent:out});
 checkInningsMilestones(inn);
 maybeEndInnings();
 render();
}

function checkInningsMilestones(inn){
 if(inn.runs>=100&&!inn._announced100){inn._announced100=true;announce("hundred","A magnificent century! 100 runs up.",{urgent:true});}
 else if(inn.runs>=50&&!inn._announced50){inn._announced50=true;announce("fifty","Fifty up! Half-century.",{urgent:true});}
 if(inn.runs>match.bestInningsRuns)match.bestInningsRuns=inn.runs;
}

function applyWearIfMatch(){
 // Only the human player's own equipment wears down, and only while they are batting.
 wearRandomItem();
}

function inningsIsOver(inn){
 return inn.balls>=TOTAL_BALLS||inn.wickets>=MAX_WICKETS||(match.target!==null&&inn.runs>=match.target);
}

function maybeEndInnings(){
 const inn=activeInnings();
 if(!inningsIsOver(inn))return;
 if(match.currentInnings===1){
  match.target=inn.runs+1;
  match.stage="innings-break";
  const battedFirstName=match.battingSide==="player"?"You":"The computer";
  const nextName=match.battingSide==="player"?"the computer":"you";
  announce(null,battedFirstName+" scored "+inn.runs+"/"+inn.wickets+". Target for "+nextName+" is "+match.target+" runs.",{urgent:true});
 }else{
  finishMatch();
 }
}
function startSecondInnings(){
 match.currentInnings=2;
 match.battingSide=match.battingFirst==="player"?"ai":"player";
 match.stage="innings";
 match.bowlStreakWickets=0;
 announce(null,"Second innings begins. "+(match.battingSide==="player"?"You are batting":"You are bowling")+". Target: "+match.target+" runs.",{urgent:true});
 render();
}

function finishMatch(){
 const playerInn=match.player,aiInn=match.ai;
 let win;
 if(match.battingFirst==="player"){
  win=aiInn.runs<match.target; // AI failed to chase
 }else{
  win=playerInn.runs>=match.target; // player successfully chased
 }
 const rewardFinal=win?(300+Math.min(200,playerInn.runs*2)):Math.max(80,80+Math.floor(playerInn.runs/2));
 let xp=win?100:50;
 if(playerInn.runs>=100)xp+=50;else if(playerInn.runs>=50)xp+=20;
 if(match.hatTrick)xp+=40;

 player.matches++;
 win?player.wins++:player.losses++;
 player.runs+=playerInn.runs;
 player.wickets+=aiInn.wickets; // wickets the player has taken while bowling
 player.balance+=rewardFinal;
 player.xp+=xp;

 let leveledUp=false;
 while(player.xp>=xpNeeded(player.level)){
  player.xp-=xpNeeded(player.level);
  player.level++;
  player.balance+=250;
  leveledUp=true;
 }

 const summary={
  date:Date.now(),
  result:win?"WIN":"LOSS",
  yourRuns:playerInn.runs,yourWickets:playerInn.wickets,
  aiRuns:aiInn.runs,aiWickets:aiInn.wickets,
  wicketsTaken:aiInn.wickets,
  reward:rewardFinal,xp:xp,
  battingFirst:match.battingFirst
 };
 player.history.push(summary);
 if(player.history.length>100)player.history.shift();

 match.bestInningsRuns=Math.max(playerInn.runs,aiInn.runs);
 const newAch=checkAchievements(match);

 match.done=true;
 match.win=win;
 match.reward=rewardFinal;
 match.xpGain=xp;
 match.newAchievements=newAch;

 pushCloud();

 const resultLine=win?"YOU WON the match! Final score — you "+playerInn.runs+"/"+playerInn.wickets+", computer "+aiInn.runs+"/"+aiInn.wickets+". Reward ₹"+rewardFinal+".":
  "Match over. You "+playerInn.runs+"/"+playerInn.wickets+", computer "+aiInn.runs+"/"+aiInn.wickets+". Your wallet was not reduced. Reward ₹"+rewardFinal+".";
 announce(win?"win":"lose",resultLine,{urgent:true});
 if(leveledUp)setTimeout(()=>announce(null,"Level up! You are now level "+player.level+". Bonus ₹250 added.",{urgent:true}),1200);
 newAch.forEach((a,i)=>setTimeout(()=>announce(null,"Achievement unlocked: "+a.name+".",{urgent:true}),1800+i*900));
}

   '<label for="f-email">Email address<input id="f-email" name="email" type="email" placeholder="Email address" autocomplete="email" required></label>'+
   '<label for="f-pass">Password<input id="f-pass" name="password" type="password" minlength="6" placeholder="Password" autocomplete="'+(isRegister?"new-password":"current-password")+'" required></label>'+
   '<button type="submit">'+(isRegister?"Create Account":"Login")+'</button>'+
  '</form>'+
  '<div class="row" style="margin-top:12px">'+
   '<button class="secondary" data-act="google">Continue with Google</button>'+
   '<button class="secondary" data-act="forgot">Forgot Password?</button>'+
  '</div>'+
  '<div class="row" style="margin-top:12px">'+
   '<button class="secondary" data-act="toggle-mode">'+(isRegister?"Back to Login":"Create an Account")+'</button>'+
   '<button class="secondary" data-act="guest">Play Offline as Guest</button>'+
  '</div>'+
  (formMsg?'<div class="notice ok" role="status">'+esc(formMsg)+'</div>':'')+
  (formError?'<div class="notice err" role="alert">'+esc(formError)+'</div>':'')+
 '</main>';
}

/* ================== RENDER: home ================== */
function homeScreen(){
 return navBar()+
  '<h1>Welcome, '+esc(player.name)+' 👋</h1>'+
  '<p class="muted">Your complete accessible cricket hub. Choose an option below.</p>'+
  '<div class="grid menu" role="group" aria-label="Main menu">'+
   '<button data-act="nav" data-arg="match" aria-label="Play a cricket match">🏏 Play Match</button>'+
   '<button data-act="nav" data-arg="profile" aria-label="View your profile and statistics">👤 Profile</button>'+
   '<button data-act="nav" data-arg="shop" aria-label="Visit the equipment shop">🛒 Shop</button>'+
   '<button data-act="nav" data-arg="settings" aria-label="Open settings">⚙️ Settings</button>'+
  '</div>'+
  '<div class="grid" style="margin-top:16px">'+
   '<div class="card"><span class="muted">Level</span><div class="stat">'+player.level+'</div></div>'+
   '<div class="card"><span class="muted">Wins</span><div class="stat">'+player.wins+'</div></div>'+
   '<div class="card"><span class="muted">Wickets Taken</span><div class="stat">'+player.wickets+'</div></div>'+
   '<div class="card"><span class="muted">Wallet</span><div class="stat">₹'+player.balance+'</div></div>'+
  '</div>'+
  (fbAuth.currentUser?'<p style="margin-top:16px"><button class="ghost" data-act="logout">Log out</button></p>':'<p style="margin-top:16px" class="muted">Playing as a guest. <button class="linklike" data-act="nav" data-arg="__login">Log in or create an account</button> to save progress online.</p>');
}

/* ================== RENDER: profile ================== */
function profileScreen(){
 const pct=Math.round((player.xp/xpNeeded(player.level))*100);
 const levelCount=Math.max(10,player.level+2);
 const statCards=[["Matches",player.matches],["Wins",player.wins],["Losses",player.losses],["Total Runs",player.runs],["Wickets Taken",player.wickets],["Fours",player.fours],["Sixes",player.sixes]];
 const historyHtml=player.history.length?
  player.history.slice().reverse().slice(0,20).map(h=>
   '<div class="card" style="margin:8px 0"><span class="tag '+(h.result==="WIN"?"win":"loss")+'">'+h.result+'</span> — You '+h.yourRuns+'/'+h.yourWickets+' vs Computer '+h.aiRuns+'/'+h.aiWickets+' — Reward ₹'+h.reward+' — XP +'+h.xp+'<br><span class="muted small">'+fmtWhen(h.date)+'</span></div>'
  ).join(""):'<p class="muted">No matches played yet.</p>';
 const achHtml=ACHIEVEMENTS.map(a=>{
  const unlocked=player.achievements.includes(a.id);
  return '<div class="card achv '+(unlocked?"unlocked":"")+'"><h3>'+(unlocked?"🏆":"🔒")+' '+esc(a.name)+'</h3><p class="muted small">'+esc(a.desc)+'</p></div>';
 }).join("");
 const levelsHtml=Array.from({length:levelCount},(_,i)=>{
  const lvl=i+1,unlocked=lvl<=player.level;
  return '<div class="card"><b>Level '+lvl+'</b><p><span class="tag '+(unlocked?"":"locked")+'">'+(unlocked?"✅ Unlocked":"🔒 Locked")+'</span></p></div>';
 }).join("");
 return navBar()+
  '<h1>👤 Profile</h1>'+
  '<div class="grid">'+
   '<div class="card"><h3>'+esc(player.name)+'</h3><p class="muted">'+esc(player.email||"Offline guest player")+'</p></div>'+
   '<div class="card"><h3>Wallet</h3><div class="stat">₹'+player.balance+'</div><p class="muted small">Losing a match never reduces your balance.</p></div>'+
  '</div>'+
  '<div class="card" style="margin-top:14px">'+
   '<h3>Level '+player.level+'</h3>'+
   '<div class="bar" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100" aria-label="Level progress, '+pct+' percent"><i style="width:'+pct+'%"></i></div>'+
   '<p>'+player.xp+' / '+xpNeeded(player.level)+' XP to next level</p>'+
  '</div>'+
  '<h2>Statistics</h2>'+
  '<div class="grid tight">'+statCards.map(([l,v])=>'<div class="card"><span class="muted small">'+l+'</span><div class="stat">'+v+'</div></div>').join("")+'</div>'+
  '<h2>Levels</h2><div class="grid tight">'+levelsHtml+'</div>'+
  '<h2>Achievements</h2><div class="grid">'+achHtml+'</div>'+
  '<h2>Match History</h2><div class="log">'+historyHtml+'</div>';
}

/* ================== RENDER: shop ================== */
function shopScreen(){
 const catalogHtml=SHOP.map(item=>{
  const owned=player.inventory[item.id];
  const canAfford=player.balance>=item.price;
  return '<div class="card"><h3>'+item.icon+' '+esc(item.name)+'</h3><p class="muted small">'+esc(item.desc)+'</p>'+
   '<p>Price: ₹'+item.price+' &nbsp;•&nbsp; Durability: '+item.durability+'</p>'+
   (owned?'<p class="tag">Owned — '+owned.durability+'/'+(owned.maxDurability||item.durability)+' durability left</p>':'')+
   '<button data-act="buy" data-arg="'+item.id+'" '+(canAfford?"":"disabled")+' aria-label="Buy '+esc(item.name)+' for '+item.price+' rupees">'+(owned?"Buy Another":"Buy")+'</button>'+
  '</div>';
 }).join("");
 const ownedIds=Object.keys(player.inventory);
 const inventoryHtml=ownedIds.length?ownedIds.map(id=>{
  const item=findShopItem(id);const v=player.inventory[id];
  const max=v.maxDurability||item.durability;
  const p=Math.round((v.durability/max)*100);
  const broken=v.durability<=0;
  return '<div class="card"><h3>'+(item?item.icon+" "+esc(item.name):id)+'</h3>'+
   (broken?'<p class="notice err" role="status">This item has worn out.</p>':'')+
   '<div class="bar dur '+(p<30?"low":"")+'" role="progressbar" aria-valuenow="'+p+'" aria-valuemin="0" aria-valuemax="100" aria-label="'+(item?item.name:id)+' durability '+p+' percent"><i style="width:'+p+'%"></i></div>'+
   '<p class="muted small">'+v.durability+' / '+max+' durability</p>'+
   (broken?'<button data-act="repair" data-arg="'+id+'" '+(player.balance<1?"disabled":"")+' aria-label="Repair '+(item?item.name:id)+' for 1 rupee">Repair for ₹1</button>':'<span class="tag">Ready to use</span>')+
  '</div>';
 }).join(""):'<p class="muted">You have not purchased any items yet.</p>';
 return navBar()+
  '<h1>🛒 Shop</h1>'+
  '<p>Wallet: <b>₹'+player.balance+'</b>. Items you cannot afford are disabled.</p>'+
  '<div class="grid">'+catalogHtml+'</div>'+
  '<h2>My Items</h2><div class="grid">'+inventoryHtml+'</div>';
}

/* ================== RENDER: settings ================== */
function settingsScreen(){
 const s=player.settings;
 const commentatorOptions=Object.entries(MANIFEST).map(([id,pack])=>
  '<option value="'+id+'" '+(s.commentator===id?"selected":"")+'>'+esc(pack.label)+' ('+esc(pack.lang)+')</option>'
 ).join("");
 return navBar()+
  '<h1>⚙️ Settings</h1>'+
  '<div class="form">'+
   '<label><input id="set-tts" type="checkbox" '+(s.tts?"checked":"")+'> Text-to-speech announcements</label>'+
   '<label><input id="set-commentary" type="checkbox" '+(s.commentary?"checked":"")+'> Play recorded commentary audio</label>'+
   '<label><input id="set-sfx" type="checkbox" '+(s.sfx?"checked":"")+'> Sound effects (dot ball / boundary / wicket chimes)</label>'+
   '<label for="set-commentator">Commentator voice pack'+
    '<select id="set-commentator">'+commentatorOptions+'</select>'+
   '</label>'+
   '<label for="set-cvol">Commentary volume<input id="set-cvol" type="range" min="0" max="1" step="0.1" value="'+s.commentaryVolume+'"></label>'+
   '<label for="set-svol">Sound effects volume<input id="set-svol" type="range" min="0" max="1" step="0.1" value="'+s.sfxVolume+'"></label>'+
   '<div class="row">'+
    '<button data-act="save-settings">Save Settings</button>'+
    '<button class="secondary" data-act="test-tts">Test TTS</button>'+
   '</div>'+
   '<hr style="border-color:#2c4868;width:100%">'+
   '<button class="danger" data-act="logout">Logout</button>'+
  '</div>';
}

/* ================== RENDER: match ================== */
function matchScreen(){
 if(!match)return navBar()+
  '<h1>🏏 Play Match</h1>'+
  '<div class="card"><h2>Quick Match</h2><p>'+OVERS_PER_INNINGS+' overs each side ('+TOTAL_BALLS+' balls) • Toss • Bat and bowl • AI opponent • Full commentary.</p>'+
  '<button data-act="start-match">Start Match</button></div>';

 if(match.stage==="toss")return navBar()+
  '<h1>🏏 Toss</h1><div class="commentary" aria-live="off">'+esc(commentaryText)+'</div>'+
  '<h2>Call the coin</h2><div class="row">'+
   '<button data-act="toss-call" data-arg="heads">Call Heads</button>'+
   '<button data-act="toss-call" data-arg="tails">Call Tails</button>'+
  '</div>';

 if(match.stage==="waiting-ai-decision")return navBar()+
  '<h1>🏏 Toss</h1><div class="commentary">'+esc(commentaryText)+'</div><p class="muted">Starting innings…</p>';

 if(match.stage==="decision")return navBar()+
  '<h1>🏏 You Won the Toss!</h1><div class="commentary">'+esc(commentaryText)+'</div>'+
  '<h2>What would you like to do?</h2><div class="row">'+
   '<button data-act="choose" data-arg="bat">Bat First</button>'+
   '<button data-act="choose" data-arg="bowl">Bowl First</button>'+
  '</div>';

 if(match.stage==="innings-break"){
  const firstBatterWasPlayer=match.battingFirst==="player";
  const firstScore=firstBatterWasPlayer?match.player:match.ai;
  const firstLabel=firstBatterWasPlayer?"You":"Computer";
  const secondLabel=firstBatterWasPlayer?"Computer":"You";
  return navBar()+
   '<h1>🏏 End of Innings 1</h1><div class="commentary">'+esc(commentaryText)+'</div>'+
   '<div class="scoreboard">'+
    '<div class="card"><span class="muted">'+firstLabel+' (Innings 1)</span><div class="stat">'+firstScore.runs+'/'+firstScore.wickets+'</div></div>'+
    '<div class="card"><span class="muted">Target for '+secondLabel+'</span><div class="stat">'+match.target+'</div></div>'+
   '</div>'+
   '<button data-act="start-second-innings">Start Second Innings</button>';
 }

 if(match.stage==="innings"){
  const battingIsPlayer=match.battingSide==="player";
  const inn=activeInnings();
  const overStr=Math.floor(inn.balls/BALLS_PER_OVER)+"."+(inn.balls%BALLS_PER_OVER);
  const controls=battingIsPlayer?
   '<h2>Choose Your Shot</h2><div class="shots" role="group" aria-label="Choose your shot">'+
    Object.keys(SHOT_TABLE).map(k=>'<button data-act="bat" data-arg="'+k+'" aria-label="Play '+SHOT_LABEL[k]+'">'+SHOT_LABEL[k]+'</button>').join("")+
   '</div>':
   '<h2>Choose Your Delivery</h2><div class="deliveries" role="group" aria-label="Choose your delivery">'+
    Object.keys(DELIVERY_TABLE).map(k=>'<button data-act="bowl" data-arg="'+k+'" aria-label="Bowl a '+DELIVERY_LABEL[k]+'">'+DELIVERY_LABEL[k]+'</button>').join("")+
   '</div>';
  return navBar()+
   '<h1>🏏 '+(match.currentInnings===1?"Innings 1":"Innings 2")+' — '+(battingIsPlayer?"You are Batting":"You are Bowling")+'</h1>'+
   '<div class="scoreboard">'+
    '<div class="card"><span class="muted">Score</span><div class="stat">'+inn.runs+'/'+inn.wickets+'</div></div>'+
    '<div class="card"><span class="muted">Over</span><div class="stat">'+overStr+'</div><span class="muted small">of '+OVERS_PER_INNINGS+'</span></div>'+
    (match.target!==null?'<div class="card"><span class="muted">Target</span><div class="stat">'+match.target+'</div></div>':'')+
   '</div>'+
   '<div class="commentary" aria-live="off">'+esc(commentaryText)+'</div>'+
   controls;
 }

 if(match.done){
  const newAch=match.newAchievements||[];
  return navBar()+
   '<h1>🏆 Match Result</h1>'+
   '<div class="card"><div class="stat">'+(match.win?"YOU WON!":"MATCH OVER")+'</div>'+
    '<p>You: '+match.player.runs+'/'+match.player.wickets+' &nbsp; Computer: '+match.ai.runs+'/'+match.ai.wickets+'</p>'+
    '<p>Reward: ₹'+match.reward+' &nbsp; XP gained: +'+match.xpGain+'</p>'+
    (newAch.length?'<p>New achievements: '+newAch.map(a=>esc(a.name)).join(", ")+'</p>':'')+
   '</div>'+
   '<div class="row" style="margin-top:14px">'+
    '<button data-act="play-again">Play Again</button>'+
    '<button class="secondary" data-act="nav" data-arg="profile">View Profile</button>'+
   '</div>';
 }
 return navBar()+'<p class="muted">Loading…</p>';
}

/* ================== RENDER: dispatch ================== */
function render(){
 const guest=localStorage.getItem(GUEST_KEY)==="1";
 if(!fbAuth.currentUser&&!guest){authScreen();return;}
 let inner;
 switch(page){
  case "profile":inner=profileScreen();break;
  case "shop":inner=shopScreen();break;
  case "settings":inner=settingsScreen();break;
  case "match":inner=matchScreen();break;
  default:inner=homeScreen();
 }
 shell(inner);
}

/* ================== EVENT DELEGATION (bound once — no duplicate handlers) ================== */
document.addEventListener("submit",ev=>{
 if(ev.target&&ev.target.id==="auth-form")doLoginOrRegister(ev);
});

document.addEventListener("click",ev=>{
 const btn=ev.target.closest("[data-act]");
 if(!btn)return;
 const act=btn.dataset.act;
 const arg=btn.dataset.arg;
 switch(act){
  case "nav":
   if(arg==="__login"){localStorage.removeItem(GUEST_KEY);render();return;}
   page=arg;formError="";formMsg="";render();break;
  case "google":doGoogle();break;
  case "forgot":doForgotPassword();break;
  case "toggle-mode":authMode=authMode==="login"?"register":"login";formError="";formMsg="";render();break;
  case "guest":doPlayOffline();break;
  case "logout":doLogout();break;
  case "buy":buyItem(arg);break;
  case "repair":repairItem(arg);break;
  case "start-match":startMatch();break;
  case "toss-call":callToss(arg);break;
  case "choose":chooseBatOrBowl(arg);break;
  case "start-second-innings":startSecondInnings();break;
  case "bat":playerBats(arg);break;
  case "bowl":playerBowls(arg);break;
  case "play-again":match=null;startMatch();break;
  case "save-settings":saveSettings();break;
  case "test-tts":speak("Blind Cricket Pro Ultimate. Text to speech is working correctly.",true);break;
 }
});

function saveSettings(){
 player.settings.tts=document.getElementById("set-tts").checked;
 player.settings.commentary=document.getElementById("set-commentary").checked;
 player.settings.sfx=document.getElementById("set-sfx").checked;
 player.settings.commentator=document.getElementById("set-commentator").value;
 player.settings.commentaryVolume=parseFloat(document.getElementById("set-cvol").value);
 player.settings.sfxVolume=parseFloat(document.getElementById("set-svol").value);
 toast="Settings saved.";
 speak(toast,true);
 pushCloud();
 render();
}

/* Attach pack ids onto MANIFEST entries for easy lookup in pickClip() */
Object.keys(MANIFEST).forEach(id=>{MANIFEST[id].id=id;});

/* ================== BOOT ================== */
render();

</script>
</body>
</html>
