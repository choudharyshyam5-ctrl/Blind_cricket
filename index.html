<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blind Cricket Pro Ultimate</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#2a0a6b 0%,#1a0840 100%);color:#fff;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{max-width:1050px;margin:auto;padding:0 0 40px}
a{color:inherit}
button{border:0;border-radius:11px;padding:13px 16px;background:#32d583;color:#06130c;font-weight:800;cursor:pointer;min-height:44px;font-size:15px}
button.secondary{background:#1b304b;color:#fff;border:1px solid #3a5878}
button.danger{background:#ff6374;color:#fff}
button.gold{background:linear-gradient(180deg,#f4d675,#d4af37);color:#241a00}
button:disabled{opacity:.45;cursor:not-allowed}
input,select{padding:12px;border-radius:10px;border:1px solid #385675;background:#091625;color:#fff;font-size:15px;min-height:44px}
.skip-link{position:absolute;left:-999px;top:0;background:#fff;color:#111;padding:10px 16px;border-radius:0 0 10px 0;z-index:999}
.skip-link:focus{left:0}
:focus-visible{outline:3px solid #63a4ff;outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.topbar{height:64px;background:#3d1f8f;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:20;border-bottom:2px solid #0a1931}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#d4af37;border:2px solid #d4af37;flex:none}
.avatar-fallback{width:48px;height:48px;border-radius:50%;background:#d4af37;color:#241a00;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.tb-name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.tb-sub{font-size:11px;color:#e7d9ff;display:flex;gap:6px;align-items:center}
.tb-right{display:flex;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:50%;background:#2a1670;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;cursor:pointer;position:relative}
.iconbtn .dot{position:absolute;top:2px;right:2px;width:9px;height:9px;background:#ff6374;border-radius:50%}
.logo-wrap{text-align:center;padding:26px 14px 10px}
.logo-emoji{font-size:34px;letter-spacing:6px}
.logo-text{font-size:30px;font-weight:900;letter-spacing:2px;background:linear-gradient(180deg,#fff6d0,#d4af37 60%,#8f6d10);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 0 rgba(0,0,0,.25);margin-top:4px}
.logo-base{height:6px;width:180px;margin:6px auto 0;background:linear-gradient(90deg,#0f5f2e,#1c8f45,#0f5f2e);border-radius:4px}
.sheet{background:#fff;color:#181022;border-radius:24px 24px 0 0;margin-top:18px;padding:22px 18px 28px;min-height:50vh}
.sheet-handle{width:48px;height:5px;background:#ddd;border-radius:3px;margin:0 auto 14px}
.contact{color:#8a3ffc;text-align:center;font-weight:800;font-size:12px;letter-spacing:.5px;margin-bottom:18px;text-decoration:underline;cursor:pointer;background:none;border:0}
.bigbtn{width:100%;text-align:left;background:#f6f3ff;border:1px solid #e3daff;border-radius:16px;padding:16px 18px;margin-bottom:14px;display:flex;flex-direction:column;gap:3px;min-height:64px;cursor:pointer}
.bigbtn b{font-size:17px;color:#241a4d}
.bigbtn span{font-size:12.5px;color:#6b5f8f}
.bigbtn:focus-visible{outline:3px solid #8a3ffc;outline-offset:2px}
.badge{display:inline-block;background:#0a1931;color:#d4af37;border:1px solid #d4af37;border-radius:20px;padding:5px 12px;font-size:11.5px;font-weight:800;margin:4px 4px 4px 0}
.screen,.card{background:#102038;border:1px solid #2c4868;border-radius:18px;padding:20px}
.screen{margin:18px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.menu-grid button{width:100%;min-height:70px;text-align:left;font-size:16px}
.nav,.row{display:flex;gap:8px;flex-wrap:wrap}
.stat{font-size:28px;font-weight:900}
.muted{color:#aebbd0}
.form{display:grid;gap:12px;max-width:520px}
.notice{padding:12px;margin:0 14px 14px;border-radius:10px;background:#18314d}
.err{border-left:4px solid #ff6374}
.bar{height:12px;background:#263d59;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#32d583,#d4af37)}
.commentary{min-height:110px;background:#071522;border:1px solid #2c4868;border-radius:12px;padding:16px;line-height:1.7}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shots button{min-height:60px}
.log{max-height:280px;overflow:auto}
.tag{background:#203b59;padding:4px 9px;border-radius:20px;font-size:12px}
.levelcard{border-left:5px solid #2c4868}
.levelcard.unlocked{border-left-color:#32d583}
.levelcard.current{border-left-color:#d4af37;background:#16294a}
.modal-back{position:fixed;inset:0;background:rgba(4,2,16,.78);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:#12102c;border:2px solid #d4af37;border-radius:20px;max-width:460px;width:100%;padding:26px;text-align:center}
.modal h2{font-size:26px;margin:6px 0}
.pill-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{padding:9px 16px;border-radius:20px;background:#1b304b;color:#fff;border:1px solid #3a5878;cursor:pointer;min-height:44px}
.pill.active{background:#32d583;color:#06130c;font-weight:800;border-color:#32d583}
.squadrow{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #223752;gap:8px;flex-wrap:wrap}
.b1{color:#ffd166;font-weight:800}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px;border-bottom:1px solid #223752;font-size:13px}
@media(max-width:600px){.shots{grid-template-columns:repeat(2,1fr)}.screen{padding:14px}.logo-text{font-size:24px}}
</style></head><body>

const ALL_LANGS=["english","hindi","urdu","telugu","tamil","kannada","bengali"];

  let pool=langPacks(commentator);

 }

function pickClip(eventKey,packId){
 let pid=packId||pickPackForSetting(player.settings.commentator);
 let pack=MANIFEST[pid]||MANIFEST.extra_default;
 let key=normEvent(eventKey);
 let files=pack.events[key];
 if(!files||!files.length){

  files=(MANIFEST.extra_default.events[key])||[];
  pid="extra_default";
 }
 if(!files.length)return null;
 let f=files[Math.floor(Math.random()*files.length)];
 return{pid,path:f};
}

   MATCH ENGINE: SHOT_TABLE / DELIVERY_TABLE / weightedPick
   ================================================================== */
const SHOT_TABLE={
 defend:[{out:0,r:0,w:.55},{out:0,r:1,w:.30},{out:1,r:0,w:.15}],
 single:[{out:0,r:1,w:.55},{out:0,r:2,w:.15},{out:0,r:0,w:.15},{out:1,r:0,w:.15}],
 double:[{out:0,r:2,w:.42},{out:0,r:1,w:.20},{out:0,r:3,w:.10},{out:0,r:0,w:.08},{out:1,r:0,w:.20}],
 four:[{out:0,r:4,w:.38,four:true},{out:0,r:1,w:.18},{out:0,r:0,w:.12},{out:1,r:0,w:.32}],
 six:[{out:0,r:6,w:.30,six:true},{out:0,r:1,w:.14},{out:0,r:0,w:.14},{out:1,r:0,w:.42}],
};
const DELIVERY_TABLE={
 straight:[{wkt:0,r:0,w:.30},{wkt:0,r:1,w:.30},{wkt:0,r:4,w:.14},{wkt:1,r:0,w:.26}],
 yorker:[{wkt:1,r:0,w:.34},{wkt:0,r:0,w:.30},{wkt:0,r:1,w:.20},{wkt:0,r:4,w:.10},{wkt:0,r:0,nb:true,w:.06}],
 bouncer:[{wkt:1,r:0,w:.22},{wkt:0,r:0,w:.20},{wkt:0,r:1,w:.18},{wkt:0,r:6,w:.16},{wkt:0,r:4,w:.14},{wkt:0,r:0,nb:true,w:.10}],
 spin:[{wkt:1,r:0,w:.28},{wkt:0,r:0,w:.28},{wkt:0,r:1,w:.24},{wkt:0,r:4,w:.12},{wkt:0,r:6,w:.08}],
};
function weightedPick(table){
 let tot=table.reduce((a,x)=>a+x.w,0),r=Math.random()*tot,acc=0;
 for(const x of table){acc+=x.w;if(r<=acc)return x}
 return table[table.length-1];
}
function playerBats(shotKey){return weightedPick(SHOT_TABLE[shotKey]||SHOT_TABLE.single)}
function playerBowls(deliveryKey){return weightedPick(DELIVERY_TABLE[deliveryKey]||DELIVERY_TABLE.straight)}
function tossCall(call){return Math.random()<.5?"H":"T"}

function newInningsState(){return{runs:0,wickets:0,balls:0,fours:0,sixes:0}}
function ballsLimit(){return matchSetupState.overs*6}
function wicketsLimit(){return matchSetupState.mode==="team"?10:matchSetupState.wicketsLimit}

function startMatch(){
 let m=matchSetupState;
 let t=tossCall();
 let userWinsToss = m.toss==="F" ? Math.random()<.5 : (m.toss===t);
 let battingFirst;
 if(userWinsToss){battingFirst="player";announce("You won the toss. You will bat first.",true)}
 else{battingFirst=Math.random()<.5?"player":"ai";announce("You lost the toss. "+(battingFirst==="player"?"The opponent chose to bowl — you bat first.":"The opponent chose to bat first."),true)}
 match={
  overs:m.overs,wicketsLimit:wicketsLimit(),innings:1,maxInnings:m.innings==="test"?4:2,
  battingFirst,current:battingFirst,
  sides:{player:newInningsState(),ai:newInningsState()},
  playerTotal:0,aiTotal:0,
  target:null,text:"Match started. "+(battingFirst==="player"?"You are batting.":"You are bowling."),
  done:false,win:null,log:[],onStrikeNote:"",
  playerBatRuns:0,playerBatFours:0,playerBatSixes:0,playerBallsFaced:0,
  playerBowlWickets:0,playerRunsConceded:0,playerBallsBowled:0,
  bowlWicketStreak:0,allOut:false,
 };
 playClip("toss");
 page="match";
 render();
 speak(match.text);
}
function currentInnings(){return match.sides[match.current]}
function oppositeSide(s){return s==="player"?"ai":"player"}

function pushLog(t){match.log.unshift(t);if(match.log.length>40)match.log.length=40}

function applyB1(runs){
 if(player.blindCategory==="B1"&&runs>0){announce("You get double runs!");return runs*2}
 return runs;
}
function rotateStrikeIfNeeded(runs){
 if([1,3,5].includes(runs)){match.onStrikeNote="Strike changes.";}else{match.onStrikeNote=""}
}

function doPlayerShot(shotKey){
 if(match.current!=="player"||match.done)return;
 let inn=currentInnings();
 let res=playerBats(shotKey);
 inn.balls++;
 match.playerBallsFaced++;
 if(res.out){
  inn.wickets++;
  match.text="OUT! Wicket falls.";
  playClip("out");speak(match.text);
  pushLog("Wicket! "+inn.wickets+"/"+wicketsLimit());
 }else{
  let runs=applyB1(res.r);
  inn.runs+=runs;
  match.playerBatRuns+=runs;
  if(res.four){inn.fours++;match.playerBatFours++}
  if(res.six){inn.sixes++;match.playerBatSixes++}
  rotateStrikeIfNeeded(res.r);
  match.text=res.six?"SIX!":res.four?"FOUR!":runs>0?(runs+" run"+(runs===1?"":"s")+" completed."):"Dot ball. No run.";
  playClip(res.six?"6":res.four?"4":String(res.r));
  speak(match.text+(match.onStrikeNote?" "+match.onStrikeNote:""));
  pushLog(match.text);
 }
 afterBall();
}
function doPlayerBowl(deliveryKey){
 if(match.current!=="ai"||match.done)return;
 let inn=currentInnings();
 let res=playerBowls(deliveryKey);
 inn.balls++;
 match.playerBallsBowled++;
 if(res.nb){
  match.text="No ball! One extra run.";inn.runs+=1;match.playerRunsConceded+=1;playClip("noball");
  match.bowlWicketStreak=0;
 }else if(res.wkt){
  inn.wickets++;match.playerBowlWickets++;match.bowlWicketStreak++;
  match.text="OUT! You've taken a wicket.";playClip("out");pushLog("Wicket! AI "+inn.wickets+"/"+wicketsLimit());
  if(match.bowlWicketStreak>=3){player.hatTricks++;match.bowlWicketStreak=0;match.text+=" HAT-TRICK!";announce("Hat-trick!",true)}
 }else{
  inn.runs+=res.r;match.playerRunsConceded+=res.r;
  if(res.r===4)inn.fours++;if(res.r===6)inn.sixes++;
  match.text=res.r===6?"SIX conceded.":res.r===4?"FOUR conceded.":res.r>0?(res.r+" run"+(res.r===1?"":"s")+" conceded."):"Dot ball. Excellent bowling.";
  playClip(res.r===6?"6":res.r===4?"4":String(res.r));
  match.bowlWicketStreak=0;
 }
 speak(match.text);
 pushLog(match.text);
 afterBall();
}
function afterBall(){
 let inn=currentInnings();
 let chasing=match.innings>1&&match.target!=null;
 let over=inn.balls>=ballsLimit()||inn.wickets>=wicketsLimit()||(chasing&&inn.runs>=match.target);
 if(over){endInnings()}else{render()}
}
function endInnings(){
 let side=match.current;
 let inn=match.sides[side];
 let allOut=inn.wickets>=wicketsLimit();
 if(side==="player"&&allOut&&inn.runs===0)player.duckWickets++;
 if(side==="player")match.playerTotal+=inn.runs; else match.aiTotal+=inn.runs;
 if(match.innings===1&&match.maxInnings===2){
  match.target=inn.runs+1;
  match.current=oppositeSide(side);
  match.innings=2;
  match.sides[match.current]=newInningsState();
  announce("Innings break. Target to win: "+match.target+" runs.",true);
  match.text="Innings break. "+(match.current==="player"?"You need "+match.target+" runs to win.":"Opponent needs "+match.target+" runs to win.");
  speak(match.text);
  render();
  return;
 }
 if(match.maxInnings===4&&match.innings<4){
  match.innings++;
  match.current=oppositeSide(side);
  match.sides[match.current]=newInningsState();
  match.target=null;
  announce("End of innings "+  (match.innings-1)+". Innings "+match.innings+" begins.",true);
  match.text="Innings "+match.innings+" begins.";
  speak(match.text);
  render();
  return;
 }
 finishMatch();
}
function finishMatch(){
 match.done=true;
 let win;
 if(match.maxInnings===2){win=match.playerTotal>match.aiTotal}
 else{win=match.playerTotal>=match.aiTotal;}
 match.win=win;
 let lvl=levelData(player.level);
 let reward=win?lvl.win:lvl.loss;
 let xpGain=win?100:25;
 let pRuns=match.playerBatRuns,pWkts=match.playerBowlWickets,pFours=match.playerBatFours,pSixes=match.playerBatSixes;

 player.matches++;
 win?player.wins++:player.losses++;
 player.runs+=pRuns;
 player.wickets+=pWkts;
 player.fours+=pFours;
 player.sixes+=pSixes;
 if(pRuns>=100)player.centuries++;
 else if(pRuns>=50)player.fifties++;
 if(pRuns>player.bestScore)player.bestScore=pRuns;
 if(pWkts>0){
  let econ=match.playerBallsBowled>0?(match.playerRunsConceded/(match.playerBallsBowled/6)):0;
  let prevBestWkts=+((player.bestSpell||"0/0").split("/")[0])||0;
  if(pWkts>=prevBestWkts)player.bestSpell=pWkts+"/"+match.playerRunsConceded;
 }
 player.totalBallsFaced=(player.totalBallsFaced||0)+match.playerBallsFaced;
 player.totalBallsBowled=(player.totalBallsBowled||0)+match.playerBallsBowled;
 player.totalRunsConceded=(player.totalRunsConceded||0)+match.playerRunsConceded;
 if(match.playerTotal!==undefined&&match.aiTotal!==undefined){
  // dismissals: count a dismissal only when the player's batting innings ended all-out
  let ps=match.sides.player;
  if(ps&&ps.wickets>=wicketsLimit())player.dismissals=(player.dismissals||0)+1;
 }
 player.strikeRate=player.totalBallsFaced>0?Math.round(player.runs/player.totalBallsFaced*1000)/10:0;
 player.economy=player.totalBallsBowled>0?Math.round(player.totalRunsConceded/(player.totalBallsBowled/6)*100)/100:0;
 player.batAvg=player.dismissals>0?Math.round(player.runs/player.dismissals*10)/10:player.runs;
 player.bowlAvg=player.wickets>0?Math.round(player.totalRunsConceded/player.wickets*10)/10:0;
 let potm=win&&(pRuns>=50||pWkts>=3);
 if(potm)player.playerOfMatch++;
 player.balance+=reward;
 player.xp+=xpGain;

 let newAchievements=[];
 for(const a of ACHIEVEMENTS){
  if(!player.achievements.includes(a.id)&&a.check(player)){player.achievements.push(a.id);newAchievements.push(a)}
 }
 let leveledUp=null;
 let nl=nextLevelData(player.level);
 while(nl&&meetsReq(nl.req,player)){
  player.level=nl.level;
  player.balance+=nl.unlockBonus||0;
  if(nl.levelUpBonus)player.balance+=nl.levelUpBonus;
  leveledUp=nl;
  nl=nextLevelData(player.level);
 }
 let salaryPaid=0;
 if(player.matches%10===0){
  let cur=levelData(player.level);
  if(cur.salary){salaryPaid=cur.salary;player.balance+=salaryPaid}
 }
 player.history.push({date:Date.now(),result:win?"WIN":"LOSS",runs:pRuns,wickets:pWkts,reward,mode:matchSetupState.mode});
 if(player.history.length>200)player.history=player.history.slice(-200);
 pushCloud();

 match.rewardBreakdown={reward,xpGain,newBalance:player.balance,newAchievements,leveledUp,salaryPaid,pRuns,pWkts,potm};
 playResultSound(win);
 if(leveledUp){setTimeout(()=>{levelUpBeep();announce("Level up! You are now "+leveledUp.title+". Bonus "+money(leveledUp.unlockBonus)+" added. New unlocks: "+leveledUp.unlocks.join(", ")+".",true)},600)}
 announce(win?"You won the match!":"Match complete. You lost.",true);
 render();
}
function closeResultPopup(){
 stopResultSound();
 match=null;
 page="home";
 render();
}

 +'<p>Match Reward: <b>'+money(r.reward)+'</b></p>'
 +'<p>XP Earned: <b>'+r.xpGain+' XP</b></p>'
 +(r.salaryPaid?'<p>Salary Paid: <b>'+money(r.salaryPaid)+'</b></p>':'')
 +(r.newAchievements&&r.newAchievements.length?r.newAchievements.map(a=>'<p>Achievement Unlocked: <b>'+e(a.name)+'</b></p>').join(""):"")
 +(r.leveledUp?'<p>Level Up! You are now <b>'+e(r.leveledUp.title)+'</b>. Bonus '+money(r.leveledUp.unlockBonus)+' added.</p>':'')
 +(r.potm?'<p>🌟 Player of the Match!</p>':'')
 +'<p>New Balance: <b>'+money(r.newBalance)+'</b></p>'
 +'<button id="continueBtn" style="margin-top:10px;width:100%">Continue</button>'
 +'</div></div>';
}

 return topBar()+'<div class="screen"><h1>Team Create</h1><form id="teamForm" class="form">'
 +'<label>Team Name<input id="tName" required></label>'
 +'<label>Captain Name<input id="tCaptain" required></label>'
 +'<label>State<input id="tState" required></label>'
 +'<label>Home Ground<input id="tGround" required></label>'
 +'<p class="muted">Total players: 11 · Minimum B1 players: 4</p>'

 +'<div class="card" style="margin-top:14px">'+(squadDraft.length?squadDraft.map((p,i)=>'<div class="squadrow"><span>'+e(p.name)+' <span class="'+(p.cat==="B1"?"b1":"")+'">('+p.cat+')</span></span><button class="danger" data-removeplayer="'+i+'">Remove</button></div>').join(""):'<p class="muted">No players yet. Add players to your squad.</p>')+'</div>'

function teamVsTeamScreen(){
 let oppNames=Object.keys(SQUADS);
 return topBar()+'<div class="screen"><h1>Team Vs Team</h1>'
 +'<div class="card"><h3>Your Team</h3><p>'+(player.teamName?e(player.teamName)+" ("+e(player.teamId)+")":"You have not created a team yet.")+'</p></div>'
 +'<div class="card" style="margin-top:14px"><h3>Opponent Team</h3><select id="oppTeam">'+oppNames.map(n=>'<option value="'+e(n)+'">'+e(n.replace(/_/g," "))+'</option>').join("")+'</select></div>'
 +'<div class="badge">11-player mode: automatically 10 wickets. Minimum 4 B1 players required in your squad.</div>'
 +'<div class="row" style="margin-top:14px"><button id="startTeamMatch" '+(player.teamId?"":"disabled")+'>Start Team Match</button><button class="secondary" data-p="home">Cancel</button></div>'
 +(player.teamId?"":'<p class="muted">Create a team first.</p>')
 +'</div>';
}
function coachScreen(){
 let c=player.coach;
 return topBar()+'<div class="screen"><h1>Coach Profile</h1>'
 +(c?('<div class="card"><b>'+e(c.name)+'</b><p>'+e(c.experience)+' yrs experience · '+e(c.village)+', '+e(c.state)+'</p><p>Academy: '+e(c.academy)+'</p><p>Family Background: '+e(c.familyBackground)+' · Category: '+e(c.blindCategory)+' · Role: '+e(c.role)+'</p><p>Teams Coached: '+(c.teamsCoached||0)+' · Win %: '+(c.winPct||0)+'% · Salary: '+money(c.salary||0)+'</p></div>')
  :'<form id="coachForm" class="form"><label>Coach Name<input id="cName" required></label><label>Experience (years)<input id="cExp" type="number" min="0"></label><label>Village<input id="cVillage"></label><label>State<input id="cState"></label><label>Academy<input id="cAcademy"></label><label>Family Background<select id="cFam"><option>Middle</option><option>Lower</option><option>Upper</option></select></label><label>Blind Category<select id="cCat"><option>B1</option><option>B2</option><option>B3</option></select></label><label>Role<select id="cRole"><option>Batsman</option><option>Bowler</option><option>Allrounder</option><option>Wicketkeeper</option></select></label><button type="submit">Save Coach Profile</button></form>')
 +'</div>';
}
function tournamentsScreen(){
 let tiers=[...new Set(TOURNAMENTS.map(t=>t.tier))];
 return topBar()+'<div class="screen"><h1>Tournaments</h1>'
 +tiers.map(tier=>'<h2>'+e(tier)+'</h2><div class="grid">'+TOURNAMENTS.filter(t=>t.tier===tier).map(t=>{
   let unlocked=tournamentUnlocked(t,player);
   return '<div class="card"><b>'+(unlocked?"✅":"🔒")+' '+e(t.name)+'</b>'
    +(unlocked?'<p>Prize: '+money(t.prize)+'</p><button data-enter="'+t.id+'" class="secondary">Enter</button>':'<p class="muted">Requires '+t.reqMatches+' matches and '+t.reqWins+' wins.</p>');
 }).join("")+'</div>').join("")
 +'</div>';
}
function ibplAuctionScreen(){
 if(player.level<6)return topBar()+'<div class="screen"><h1>IBPL Auction</h1><p class="muted">Unlocks at National level (Level 6).</p></div>';
 let pool=[];
 Object.entries(SQUADS).forEach(([team,d])=>d.players.forEach(name=>pool.push(name)));
 pool=[...new Set(pool)].slice(0,40);
 return topBar()+'<div class="screen"><h1>IBPL Auction — Owner Mode</h1><p>Budget: <b>₹50,00,000</b> · Build an 11-player squad with a minimum of 4 B1 players.</p>'
 +'<div class="grid">'+pool.map(n=>'<div class="card"><b>'+e(n)+'</b><button class="secondary" data-auction="'+e(n)+'">Bid</button></div>').join("")+'</div>'
 +'<p class="muted">Blind-category tags (B1/B2/B3) shown for auction players are simulated for gameplay, since public squad data does not include real classification.</p>'
 +'</div>';
}
function resumeScreen(){
 return topBar()+'<div class="screen"><h1>Resume</h1>'
 +(match&&!match.done?'<button data-p="match">Resume Current Match</button>':'<p class="muted">No match in progress.</p>')
 +'</div>';
}

/* ---------------- Auth screens ---------------- */
function authScreen(){
 root.innerHTML='<main id="main" class="screen" style="max-width:560px;margin:60px auto;text-align:center"><h1>🏏 Blind Cricket Pro Ultimate</h1><p class="muted">Sign in to save your profile, wallet, career progress and shop items.</p><button id="google" style="width:100%;min-height:52px;font-size:17px">Continue with Google</button>'+(err?'<div class="notice err" role="alert">'+e(err)+'</div>':'')+'</main>';
 bind();
}
function loadingScreen(){
 root.innerHTML='<main id="main" class="screen" style="max-width:560px;margin:60px auto;text-align:center" aria-busy="true"><h1>🏏 Blind Cricket Pro Ultimate</h1><p>Signing in with Google...</p><p class="muted">Please wait...</p></main>';
}
function onboardingScreen(){
 root.innerHTML='<main id="main" class="screen" style="max-width:560px;margin:30px auto"><h1>Welcome, '+e(player.name)+'!</h1><p class="muted">A few quick details to set up your profile.</p><form id="obf" class="form">'
 +'<label>Name<input value="'+e(player.name)+'" disabled></label>'
 +'<label>Email<input value="'+e(player.email)+'" disabled></label>'
 +'<label>Village<input id="ob_village" placeholder="Village or city"></label>'
 +'<label>State<input id="ob_state" placeholder="State"></label>'
 +'<label>Age<input id="ob_age" type="number" min="12" max="40" placeholder="12-40"></label>'
 +'<label>Academy<input id="ob_academy" placeholder="Academy (optional)"></label>'
 +'<label>Family Background<select id="ob_fam"><option>Middle</option><option>Lower</option><option>Upper</option></select></label>'
 +'<label>Blind Category<select id="ob_cat"><option value="B1">B1</option><option value="B2" selected>B2</option><option value="B3">B3</option></select></label>'
 +'<label>Role<select id="ob_role"><option>Batsman</option><option>Bowler</option><option>Allrounder</option><option>Wicketkeeper</option></select></label>'
 +'<button>Save and Continue</button></form>'+(err?'<div class="notice err" role="alert">'+e(err)+'</div>':'')+'</main>';
 bind();
}

/* ---------------- Render dispatcher ---------------- */
function render(){
 if(booting){loadingScreen();return}
 if(!auth.currentUser){authScreen();return}
 if(page==="onboarding"){onboardingScreen();return}
 let body;
 if(page==="home")body=homeHandCricket();
 else if(page==="help")body=helpScreen();
 else if(page==="career")body=careerScreen();
 else if(page==="profile"||page==="mycollection")body=profileScreen();
 else if(page==="shop")body=shopScreen();
 else if(page==="settings")body=settingsScreen();
 else if(page==="matchSetup")body=matchSetupScreen();
 else if(page==="match")body=matchScreen();
 else if(page==="teamCreate")body=teamCreateScreen();
 else if(page==="mySquad")body=mySquadScreen();
 else if(page==="teamVsTeam")body=teamVsTeamScreen();
 else if(page==="coach")body=coachScreen();
 else if(page==="tournaments")body=tournamentsScreen();
 else if(page==="ibplAuction")body=ibplAuctionScreen();
 else if(page==="resume"||page==="resumeTournament")body=resumeScreen();
 else if(page==="notifications")body=topBar()+'<div class="screen"><h1>Notifications</h1><p class="muted">No new notifications.</p></div>';
 else body=homeHandCricket();
 root.innerHTML='<div class="wrap"><main id="main">'+(msg?'<div class="notice">'+e(msg)+'</div>':'')+body+'</main></div>'+menuOverlay();
 bind();
}

/* ---------------- Event binding ---------------- */
async function google(){err="";try{await signInWithRedirect(auth,new GoogleAuthProvider())}catch(x){err=friendlyAuthError(x);render()}}
async function saveOnboarding(ev){
 ev.preventDefault();
 player.village=document.getElementById("ob_village").value.trim();
 player.state=document.getElementById("ob_state").value.trim();
 player.age=+document.getElementById("ob_age").value||null;
 player.academy=document.getElementById("ob_academy").value.trim();
 player.familyBackground=document.getElementById("ob_fam").value;
 player.blindCategory=document.getElementById("ob_cat").value;
 player.role=document.getElementById("ob_role").value;
 await pushCloud();
 msg="Saved to Online ✓";
 page="home";
 announce(msg,true);
 render();
}
function buy(id){
 let it=SHOP.find(x=>x.id===id);
 let price=shopPrice(it.base,player.level);
 if(player.balance<price)return;
 player.balance-=price;
 player.inventory[id]={dur:it.dur};
 pushCloud();
 msg=it.name+" purchased for "+money(price)+".";
 announce(msg,true);
 speak(msg);
 render();
}
function bind(){
 document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
  let mode=b.dataset.mode;
  if(mode)matchSetupState.mode=mode;
  page=b.dataset.p;msg="";menuOpen=false;render();
 });
 let menuBtn=document.getElementById("menuBtn");if(menuBtn)menuBtn.onclick=()=>{menuOpen=!menuOpen;render()};
 let menuBack=document.getElementById("menuBack");if(menuBack)menuBack.onclick=(ev)=>{if(ev.target===menuBack){menuOpen=false;render()}};
 document.querySelectorAll("[data-menu]").forEach(b=>b.onclick=()=>{
  let id=b.dataset.menu;menuOpen=false;
  if(id==="logout"){doLogout();return}
  if(id==="matchSetup"){matchSetupState.mode="cpu"}
  page=id;render();
 });
 let g=document.getElementById("google");if(g)g.onclick=google;
 let obf=document.getElementById("obf");if(obf)obf.onsubmit=saveOnboarding;
 document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buy(b.dataset.buy));
 let saveSet=document.getElementById("saveSet");
 if(saveSet)saveSet.onclick=()=>{
  player.settings.tts=document.getElementById("tts").checked;
  player.settings.commentary=document.getElementById("com").checked;
  player.settings.sfx=document.getElementById("sfx").checked;
  player.settings.commentaryVolume=+document.getElementById("cvol").value;
  player.settings.sfxVolume=+document.getElementById("svol").value;
  player.settings.commentator=document.getElementById("commLang").value;
  pushCloud();msg="Settings saved.";announce(msg,true);render();
 };
 let testTts=document.getElementById("testTts");if(testTts)testTts.onclick=()=>speak("Blind Cricket Pro Ultimate. Text to speech is working.");
 let testC=document.getElementById("testCommentary");if(testC)testC.onclick=()=>{
  let tempCommentator=document.getElementById("commLang").value;
  let pid=pickPackForSetting(tempCommentator);
  let clip=pickClip("4",pid);
  if(clip){
   let a=new Audio(SOUND_BASE_PRIMARY+clip.path.split("/").map(encodeURIComponent).join("/"));
   a.onerror=()=>{a.src=SOUND_BASE_FALLBACK+clip.path.split("/").map(encodeURIComponent).join("/");a.play().catch(()=>{})};
   a.play().catch(()=>{});
   announce("Playing test clip from "+packLabel(clip.pid),true);
  }
 };
 let lo=document.getElementById("logout");if(lo)lo.onclick=doLogout;
 // match setup pills
 document.querySelectorAll("[data-overs]").forEach(b=>b.onclick=()=>{matchSetupState.overs=+b.dataset.overs;render()});
 let co=document.getElementById("customOvers");if(co)co.onchange=()=>{let v=+co.value;if(v>=1&&v<=50){matchSetupState.overs=v;render()}};
 document.querySelectorAll("[data-format]").forEach(b=>b.onclick=()=>{matchSetupState.format=b.dataset.format;render()});
 document.querySelectorAll("[data-innings]").forEach(b=>b.onclick=()=>{if(!b.disabled){matchSetupState.innings=b.dataset.innings;render()}});
 document.querySelectorAll("[data-wkts]").forEach(b=>b.onclick=()=>{matchSetupState.wicketsLimit=+b.dataset.wkts;render()});
 let cw=document.getElementById("customWkts");if(cw)cw.onchange=()=>{let v=+cw.value;if(v>=1&&v<=10){matchSetupState.wicketsLimit=v;render()}};
 document.querySelectorAll("[data-toss]").forEach(b=>b.onclick=()=>{matchSetupState.toss=b.dataset.toss;render()});
 let bm=document.getElementById("beginMatch");if(bm)bm.onclick=startMatch;
 document.querySelectorAll("[data-shot]").forEach(b=>b.onclick=()=>doPlayerShot(b.dataset.shot));
 document.querySelectorAll("[data-ball]").forEach(b=>b.onclick=()=>doPlayerBowl(b.dataset.ball));
 let cb=document.getElementById("continueBtn");if(cb)cb.onclick=closeResultPopup;
 let qb=document.getElementById("quitMatchBtn");if(qb)qb.onclick=()=>{if(confirm("Quit this match? No reward will be earned."))quitMatch()};
 // team
 let tf=document.getElementById("teamForm");if(tf)tf.onsubmit=(ev)=>{
  ev.preventDefault();
  let tState=document.getElementById("tState").value.trim();
  let teamId=genTeamId(tState);
  let team={teamId,name:document.getElementById("tName").value.trim(),captain:document.getElementById("tCaptain").value.trim(),state:tState,ground:document.getElementById("tGround").value.trim(),players:squadDraft,ownerUid:player.uid};
  player.teamId=teamId;player.teamName=team.name;
  saveTeamLocal(team);pushTeamCloud(team);pushCloud();
  msg="Your team is ready! Your Team ID is "+teamId+". Give this to your coach.";
  announce(msg,true);render();
 };
 let ctid=document.getElementById("copyTeamId");if(ctid)ctid.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(player.teamId);msg="Team ID copied.";render()};
 let apf=document.getElementById("addPlayerForm");if(apf)apf.onsubmit=(ev)=>{
  ev.preventDefault();
  if(squadDraft.length>=11)return;
  squadDraft.push({name:document.getElementById("pName").value.trim(),cat:document.getElementById("pCat").value});
  render();
 };
 document.querySelectorAll("[data-removeplayer]").forEach(b=>b.onclick=()=>{squadDraft.splice(+b.dataset.removeplayer,1);render()});
 let stm=document.getElementById("startTeamMatch");if(stm)stm.onclick=()=>{matchSetupState.mode="team";page="matchSetup";render()};
 let cf=document.getElementById("coachForm");if(cf)cf.onsubmit=(ev)=>{
  ev.preventDefault();
  player.coach={name:document.getElementById("cName").value.trim(),experience:document.getElementById("cExp").value||0,village:document.getElementById("cVillage").value.trim(),state:document.getElementById("cState").value.trim(),academy:document.getElementById("cAcademy").value.trim(),familyBackground:document.getElementById("cFam").value,blindCategory:document.getElementById("cCat").value,role:document.getElementById("cRole").value,teamsCoached:0,winPct:0,salary:0};
  pushCloud();msg="Coach profile saved.";announce(msg,true);render();
 };
 document.querySelectorAll("[data-enter]").forEach(b=>b.onclick=()=>{msg="Entered tournament: "+b.dataset.enter+". Fixtures will use your current match settings.";announce(msg,true);render()});
 document.querySelectorAll("[data-auction]").forEach(b=>b.onclick=()=>{msg=b.dataset.auction+" added to your auction shortlist.";announce(msg,true);render()});
}
async function doLogout(){
 await signOut(auth);
 clearLocalSession();
 stopCommentary();stopResultSound();
 player={...base,settings:{...DEFAULT_SETTINGS}};
 page="login";match=null;
 render();
}

/* Keyboard accessibility shortcuts: B = bat/primary action, Ctrl+B = bowl, A = summary */
window.addEventListener("keydown",(ev)=>{
 if(!match||match.done)return;
 if(ev.key.toLowerCase()==="b"&&!ev.ctrlKey&&match.current==="player"){doPlayerShot("single")}
 else if(ev.key.toLowerCase()==="b"&&ev.ctrlKey&&match.current==="ai"){doPlayerBowl("straight")}
 else if(ev.key.toLowerCase()==="a"){let inn=currentInnings();announce("Score "+inn.runs+" for "+inn.wickets+", over "+Math.floor(inn.balls/6)+"."+(inn.balls%6),true)}
});

render();
</script></body></html>
