<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blind Cricket Pro Ultimate</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff;font:16px system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:24px;font-weight:900}.wallet{padding:10px 15px;border-radius:20px;background:#1a304c;color:#ffd166;font-weight:900}.screen,.card{background:#102038;border:1px solid #2c4868;border-radius:18px;padding:20px}.screen{margin-top:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.nav,.row{display:flex;gap:8px;flex-wrap:wrap}.menu button{width:100%;min-height:70px;text-align:left;font-size:18px}button{border:0;border-radius:11px;padding:13px 16px;background:#32d583;color:#06130c;font-weight:800;cursor:pointer}button.secondary{background:#1b304b;color:#fff;border:1px solid #3a5878}button.danger{background:#ff6374;color:#fff}button:disabled{opacity:.45}.stat{font-size:30px;font-weight:900}.muted{color:#aebbd0}.form{display:grid;gap:12px;max-width:520px}.form input{padding:13px;border-radius:10px;border:1px solid #385675;background:#091625;color:#fff}.notice{padding:12px;margin:12px 0;border-radius:10px;background:#18314d}.err{border-left:4px solid #ff6374}.bar{height:12px;background:#263d59;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:#32d583}.commentary{min-height:120px;background:#071522;border:1px solid #2c4868;border-radius:12px;padding:16px;line-height:1.7}.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.shots button{min-height:65px}.log{max-height:300px;overflow:auto}.tag{background:#203b59;padding:4px 9px;border-radius:20px}@media(max-width:600px){.shots{grid-template-columns:repeat(2,1fr)}.screen{padding:14px}}
:focus-visible{outline:3px solid #63a4ff;outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style></head><body><div id="app"></div>
<div id="live-gentle" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="live-urgent" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence,signInWithRedirect,getRedirectResult,GoogleAuthProvider,signOut}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const cfg=window.__FIREBASE_CONFIG__||{apiKey:"AIzaSyCFPUinpbamY58LSmu9aVUJNdwjXG7BdjU",authDomain:"blind-cricket-efc31.firebaseapp.com",projectId:"blind-cricket-efc31",storageBucket:"blind-cricket-efc31.firebasestorage.app",messagingSenderId:"121893939422",appId:"1:121893939422:web:5a90638fcadf0a2857ba4f",measurementId:"G-W3ZVRH1GCE"};
const firebase=initializeApp(cfg),auth=getAuth(firebase),db=getFirestore(firebase),root=document.getElementById("app");
const base={name:"Player",email:"",uid:"",photoURL:"",balance:2000,level:1,xp:0,matches:0,wins:0,losses:0,runs:0,wickets:0,settings:{tts:true,commentary:true,sfx:true,volume:.8},inventory:{},history:[]};
const shop=[
["bat","Starter Bat",100,8],["powerbat","Power Bat",500,12],["gloves","Batting Gloves",150,8],
["helmet","Safety Helmet",250,10],["shoes","Cricket Shoes",300,10],["jersey","Team Jersey",200,15]];
let player=loadLocal(),page="home",msg="",err="",match=null;
// booting: true until we've processed the redirect result AND received the first
// onAuthStateChanged callback. Firebase Auth state is the ONLY source of truth for
// whether someone is logged in — localStorage is just a cache of the last-known
// profile and is never used, by itself, to decide whether to show the login screen.
let booting=true,authReady=false,redirectChecked=false;

function loadLocal(){try{return Object.assign({},base,JSON.parse(localStorage.getItem("BCPU_PLAYER_V2")||localStorage.getItem("BCPU")||"null"))}catch{return {...base}}}
function saveLocal(){localStorage.setItem("BCPU_PLAYER_V2",JSON.stringify(player));if(player.uid)localStorage.setItem("blindCricketCurrentUser",player.uid)}
function clearLocalSession(){localStorage.removeItem("BCPU_PLAYER_V2");localStorage.removeItem("blindCricketCurrentUser");localStorage.removeItem("BCPU");localStorage.removeItem("BCPU_GUEST")}
function e(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function need(){return player.level*100}
function speak(t){if(player.settings.tts&&speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.volume=player.settings.volume;speechSynthesis.speak(u)}}
function announce(t,urgent){let r=document.getElementById(urgent?"live-urgent":"live-gentle");if(r)r.textContent=t}
function sanitizeForCloud(p){let{password,...rest}=p;return rest}
async function pushCloud(){saveLocal();if(!auth.currentUser)return;try{await setDoc(doc(db,"players",auth.currentUser.uid),{...sanitizeForCloud(player),updatedAt:Date.now()},{merge:true})}catch(x){console.log(x)}}
async function loadForUser(u){
 try{
  let snap=await getDoc(doc(db,"players",u.uid));
  if(snap.exists()){
   let cloudData=snap.data();
   // merge safely: cloud data wins for known fields, but never drop fields the
   // cloud doc doesn't have yet (keeps stats/inventory/history intact)
   player=Object.assign({},base,cloudData,{uid:u.uid,email:u.email||cloudData.email||"",photoURL:u.photoURL||cloudData.photoURL||"",name:cloudData.name||u.displayName||"Player"});
   saveLocal();
   page="home";
  }else{
   player={...base,uid:u.uid,email:u.email||"",photoURL:u.photoURL||"",name:u.displayName||"Player"};
   saveLocal();
   page="onboarding";
  }
 }catch(x){err="Could not load your profile. Check your connection.";console.log(x)}
 announce("Signed in as "+(player.name||"Player"),true);
 render();
}
function friendlyAuthError(x){
 let code=x&&x.code||"";
 if(code==="auth/unauthorized-domain")return "This site isn't authorized for Google Sign-In yet. Add choudharyshyam5-ctrl.github.io in Firebase Console → Authentication → Settings → Authorized domains.";
 if(code==="auth/popup-closed-by-user"||code==="auth/cancelled-popup-request")return "Sign-in was cancelled.";
 if(code==="auth/network-request-failed")return "Network error. Check your connection and try again.";
 if(code==="auth/too-many-requests")return "Too many attempts. Please wait a moment and try again.";
 return "Could not sign you in. Please try again.";
}

// ---- Boot sequence (must run in this order) ----
// 1. set persistence  2. process any pending redirect result  3. subscribe to
// onAuthStateChanged, which is the real source of truth from then on.
setPersistence(auth,browserLocalPersistence)
 .catch(x=>console.log(x))
 .then(()=>getRedirectResult(auth))
 .then(r=>{ if(r&&r.user){/* handled by onAuthStateChanged below too, this just surfaces errors early */ } })
 .catch(x=>{ err=friendlyAuthError(x); })
 .then(()=>{
  redirectChecked=true;
  onAuthStateChanged(auth,u=>{
   authReady=true;
   booting=false;
   if(u)loadForUser(u);
   else{
    // Firebase says nobody is signed in — stale local data is not proof of
    // authentication, so clear it and show Google Sign-In. Never fabricate a guest profile.
    if(player.uid)clearLocalSession();
    player={...base};
    page="login";
    render();
   }
  });
 });

function nav(){return '<div class="nav"><button class="secondary" data-p="home">Home</button><button class="secondary" data-p="match">Play Match</button><button class="secondary" data-p="profile">Profile</button><button class="secondary" data-p="shop">Shop</button><button class="secondary" data-p="settings">Settings</button></div>'}
function shell(c){root.innerHTML='<div class="wrap"><header class="top"><div class="brand">🏏 Blind Cricket Pro Ultimate</div><div class="wallet">Wallet ₹'+player.balance+'</div></header>'+(msg?'<div class="notice">'+e(msg)+'</div>':'')+'<main class="screen">'+c+'</main></div>';bind()}
function authScreen(){root.innerHTML='<main class="screen" style="max-width:650px;margin:30px auto"><h1>Blind Cricket Pro Ultimate</h1><p class="muted">Sign in to save your profile, wallet, career progress and shop items.</p><button id="google" style="width:100%;min-height:52px;font-size:17px">Continue with Google</button>'+(err?'<div class="notice err" role="alert">'+e(err)+'</div>':'')+'</main>';bind()}
function loadingScreen(){root.innerHTML='<main class="screen" style="max-width:650px;margin:30px auto" aria-busy="true"><h1>Blind Cricket Pro Ultimate</h1><p class="muted">Checking your sign-in status…</p></main>'}
function onboarding(){root.innerHTML='<main class="screen" style="max-width:650px;margin:30px auto"><h1>Welcome, '+e(player.name)+'!</h1><p class="muted">A few quick details to set up your profile.</p><form id="obf" class="form"><label>Name<input value="'+e(player.name)+'" disabled></label><label>Email<input value="'+e(player.email)+'" disabled></label><label>Village/City<input id="ob_village" placeholder="Village or city"></label><label>State<input id="ob_state" placeholder="State"></label><label>Age<input id="ob_age" type="number" min="12" max="40" placeholder="12-40"></label><label>Blind Category<select id="ob_cat"><option value="B1">B1</option><option value="B2">B2</option><option value="B3">B3</option></select></label><label>Role<select id="ob_role"><option>Batsman</option><option>Bowler</option><option>Allrounder</option><option>Wicketkeeper</option></select></label><button>Save and Continue</button></form>'+(err?'<div class="notice err" role="alert">'+e(err)+'</div>':'')+'</main>';bind()}
function home(){return nav()+'<h1>Welcome, '+e(player.name)+' 👋</h1><p class="muted">Your complete cricket hub.</p><div class="grid menu"><button data-p="match">🏏 Play Match</button><button data-p="profile">👤 Profile</button><button data-p="shop">🛒 Shop</button><button data-p="settings">⚙️ Settings</button></div><div class="grid" style="margin-top:15px"><div class="card"><span class="muted">Level</span><div class="stat">'+player.level+'</div></div><div class="card"><span class="muted">Wins</span><div class="stat">'+player.wins+'</div></div><div class="card"><span class="muted">Wickets</span><div class="stat">'+player.wickets+'</div></div></div>'}
function profile(){let p=Math.round(player.xp/need()*100);return nav()+'<h1>👤 Profile</h1><div class="grid"><div class="card"><h3>'+e(player.name)+'</h3><p>'+e(player.email||"Offline player")+'</p></div><div class="card"><h3>Wallet</h3><div class="stat">₹'+player.balance+'</div><p class="muted">Losses never deduct money.</p></div></div><div class="card" style="margin-top:14px"><h3>Level '+player.level+'</h3><div class="bar"><i style="width:'+p+'%"></i></div><p>'+player.xp+'/'+need()+' XP</p></div><div class="grid" style="margin-top:14px">'+[["Matches",player.matches],["Wins",player.wins],["Losses",player.losses],["Runs",player.runs],["Wickets",player.wickets]].map(a=>'<div class="card"><span class="muted">'+a[0]+'</span><div class="stat">'+a[1]+'</div></div>').join("")+'</div><h2>Levels</h2><div class="grid">'+Array.from({length:Math.max(8,player.level+2)},(_,i)=>'<div class="card"><b>Level '+(i+1)+'</b><p>'+(i+1<=player.level?"✅ Unlocked":"🔒 Locked")+'</p></div>').join("")+'</div><h2>Match History</h2><div class="log">'+(player.history.length?player.history.slice().reverse().map(h=>'<div class="card" style="margin:8px 0"><b>'+e(h.result)+'</b> — '+h.runs+'/'+h.wickets+' — Reward ₹'+h.reward+'<br><span class="muted">'+new Date(h.date).toLocaleString()+'</span></div>').join(""):"<p class='muted'>No matches yet.</p>")+'</div>'}
function shopView(){return nav()+'<h1>🛒 Shop</h1><p>Wallet: <b>₹'+player.balance+'</b>. Items above your balance cannot be bought.</p><div class="grid">'+shop.map(i=>{let v=player.inventory[i[0]];return '<div class="card"><h3>'+i[1]+'</h3><p>Price: ₹'+i[2]+'</p><p>Durability: '+(v?v.dur:0)+'/'+i[3]+'</p><button data-buy="'+i[0]+'" '+(player.balance<i[2]?"disabled":"")+'>'+(v?"Buy Again":"Buy")+'</button></div>'}).join("")+'</div><h2>My Items</h2><div class="grid">'+(Object.keys(player.inventory).length?Object.entries(player.inventory).map(a=>{let i=shop.find(x=>x[0]==a[0]);return '<div class="card"><b>'+e(i?.[1]||a[0])+'</b><p>Durability: '+a[1].dur+'</p>'+(a[1].dur<=0?'<button data-repair="'+a[0]+'" '+(player.balance<1?"disabled":"")+'>Repair for ₹1</button>':'<span class="tag">Ready</span>')+'</div>'}).join(""):"<p class='muted'>No items purchased.</p>")+'</div>'}
function settings(){return nav()+'<h1>⚙️ Settings</h1><div class="form"><label><input id="tts" type="checkbox" '+(player.settings.tts?"checked":"")+'> TTS</label><label><input id="com" type="checkbox" '+(player.settings.commentary?"checked":"")+'> Match commentary</label><label><input id="sfx" type="checkbox" '+(player.settings.sfx?"checked":"")+'> Sound effects</label><label>Voice volume <input id="vol" type="range" min="0" max="1" step=".1" value="'+player.settings.volume+'"></label><button id="saveSet">Save Settings</button><button class="secondary" id="test">Test TTS</button><button class="danger" id="logout">Logout</button></div>'}
function matchView(){
 if(!match)return nav()+'<h1>🏏 Play Match</h1><div class="card"><h2>Quick Match</h2><p>12 balls • AI opponent • TTS commentary.</p><button id="start">Start Match</button></div>';
 if(match.done)return nav()+'<h1>🏆 Match Result</h1><div class="card"><div class="stat">'+(match.win?"YOU WON!":"MATCH OVER")+'</div><p>Score: '+match.runs+'/'+match.wickets+'</p><p>Reward: ₹'+match.reward+'</p><button id="again">Play Again</button></div>';
 return nav()+'<h1>🏏 Match</h1><div class="grid"><div class="card"><span class="muted">Score</span><div class="stat">'+match.runs+'/'+match.wickets+'</div><p>Ball '+match.ball+'/12</p></div><div class="card"><span class="muted">Target</span><div class="stat">'+match.target+'</div></div></div><div class="commentary" aria-live="polite"><b>Commentary</b><br>'+e(match.text)+'</div><h2>Choose Shot</h2><div class="shots"><button data-shot="0">Defend</button><button data-shot="1">1 Run</button><button data-shot="2">2 Runs</button><button data-shot="4">4 Runs</button><button data-shot="6">6 Runs</button></div>'}
function render(){
 if(booting){loadingScreen();return}
 if(!auth.currentUser){authScreen();return}
 if(page=="onboarding"){onboarding();return}
 let c=page=="home"?home():page=="profile"?profile():page=="shop"?shopView():page=="settings"?settings():matchView();
 shell(c);
}
async function google(){err="";try{await signInWithRedirect(auth,new GoogleAuthProvider())}catch(x){err=friendlyAuthError(x);render()}}
async function saveOnboarding(ev){
 ev.preventDefault();
 player.village=document.getElementById("ob_village").value.trim();
 player.state=document.getElementById("ob_state").value.trim();
 player.age=+document.getElementById("ob_age").value||null;
 player.blindCategory=document.getElementById("ob_cat").value;
 player.role=document.getElementById("ob_role").value;
 await pushCloud();
 msg="Saved to Online ✓";
 page="home";
 announce(msg,true);
 render();
}
function buy(id){let i=shop.find(x=>x[0]==id);if(player.balance<i[2])return;player.balance-=i[2];player.inventory[id]={dur:i[3]};pushCloud();msg=i[1]+" purchased.";speak(msg);render()}
function repair(id){let i=shop.find(x=>x[0]==id),v=player.inventory[id];if(!i||!v||v.dur>0||player.balance<1)return;player.balance--;v.dur=i[3];pushCloud();msg=i[1]+" repaired for ₹1.";speak(msg);render()}
function start(){match={runs:0,wickets:0,ball:0,target:12+Math.floor(Math.random()*13),text:"Match started. Choose your shot.",done:false};render();speak("Match started. Choose your shot.")}
function shot(n){let out=Math.random()<.13;match.ball++;if(out){match.wickets++;match.text="OUT! Wicket.";speak(match.text)}else{match.runs+=n;match.text=n==6?"SIX!":n==4?"FOUR!":n+" run"+(n==1?"":"s")+" completed.";speak(match.text)}wear();if(match.runs>=match.target||match.ball>=12||match.wickets>=3)finish();else render()}
function wear(){let ids=Object.keys(player.inventory).filter(x=>player.inventory[x].dur>0);if(!ids.length)return;let id=ids[Math.floor(Math.random()*ids.length)];player.inventory[id].dur--;if(player.inventory[id].dur==0){let i=shop.find(x=>x[0]==id);match.text+=" "+i[1]+" has worn out. Repair it in Shop for ₹1.";speak(i[1]+" has worn out. Repair it for one rupee in the shop.")}pushCloud()}
function finish(){let win=match.runs>=match.target,reward=win?250:100;player.matches++;win?player.wins++:player.losses++;player.runs+=match.runs;player.wickets+=match.wickets;player.balance+=reward;player.xp+=win?80:40;while(player.xp>=need()){player.xp-=need();player.level++;player.balance+=250}player.history.push({date:Date.now(),result:win?"WIN":"LOSS",runs:match.runs,wickets:match.wickets,reward});pushCloud();match={...match,done:true,win,reward};render();speak(win?"You won the match!":"Match lost. Your wallet was not reduced.")}
function bind(){
 document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{page=b.dataset.p;msg="";render()});
 let g=document.getElementById("google");if(g)g.onclick=google;
 let obf=document.getElementById("obf");if(obf)obf.onsubmit=saveOnboarding;
 let st=document.getElementById("start");if(st)st.onclick=start;
 let ag=document.getElementById("again");if(ag)ag.onclick=()=>{match=null;start()};
 document.querySelectorAll("[data-shot]").forEach(b=>b.onclick=()=>shot(+b.dataset.shot));
 document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buy(b.dataset.buy));
 document.querySelectorAll("[data-repair]").forEach(b=>b.onclick=()=>repair(b.dataset.repair));
 let s=document.getElementById("saveSet");if(s)s.onclick=()=>{player.settings.tts=document.getElementById("tts").checked;player.settings.commentary=document.getElementById("com").checked;player.settings.sfx=document.getElementById("sfx").checked;player.settings.volume=+document.getElementById("vol").value;pushCloud();msg="Settings saved.";render()};
 let tt=document.getElementById("test");if(tt)tt.onclick=()=>speak("Blind Cricket Pro Ultimate. TTS is working.");
 let lo=document.getElementById("logout");if(lo)lo.onclick=async()=>{
  // signOut only clears the local session state; it never touches the
  // Firestore players/{uid} document, so progress is intact on next login.
  await signOut(auth);
  clearLocalSession();
  player={...base};
  page="home";
  render();
 };
}
render();
</script></body></html>
